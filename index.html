<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101722">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Full Body JJB</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f4f1ea; --card:#ffffff; --ink:#151a22; --mute:#5b6270; --line:#d5d0c4;
  --acc:#1747a6; --acc-ink:#ffffff; --warn:#8a5a00; --warn-bg:#fff2d6;
  --ok-bg:#e3ebfb; --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0f141c; --card:#18202c; --ink:#eef1f6; --mute:#a3abb8; --line:#2c3644;
  --acc:#7fa8ff; --acc-ink:#0f141c; --warn:#ffc861; --warn-bg:#3a2e14; --ok-bg:#1d2a44;}
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:0 0 calc(76px + env(safe-area-inset-bottom));min-height:100vh}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 10px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:8px}
header h1{font-size:19px;letter-spacing:.2px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;border:2px solid var(--ink);
  border-radius:999px;padding:2px 10px;white-space:nowrap}
.chip.dash{border-style:dashed}
main{padding:12px 16px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:0 0 12px}
h2{font-size:17px;margin:4px 0 8px}
h3{font-size:15px;margin:0 0 4px}
.mute{color:var(--mute);font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
button{font:inherit;cursor:pointer;border-radius:12px;border:2px solid var(--ink);background:transparent;color:var(--ink);
  padding:10px 14px;font-weight:700;min-height:46px}
button.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
button.big{width:100%;font-size:19px;min-height:62px}
button.sm{min-height:36px;padding:4px 10px;font-size:14px}
.sess{display:grid;grid-template-columns:1fr;gap:10px}
.sessbtn{text-align:left;display:flex;justify-content:space-between;align-items:center;background:var(--card);border:2px solid var(--line);gap:8px}
.sessbtn b{font-size:18px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
label{font-size:14px;color:var(--mute);display:block;margin:6px 0 3px}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.check:first-of-type{border-top:0}
.check input{width:24px;height:24px;flex:none;margin-top:1px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mute);font-weight:600}
.num{text-align:right;font-variant-numeric:tabular-nums}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--line);
  display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;min-height:52px;font-size:14px;border-radius:10px}
nav button[aria-current="true"]{background:var(--ok-bg);text-decoration:underline;text-underline-offset:4px}
.blk{border-left:4px solid var(--ink);padding-left:10px;margin:12px 0 4px}
.blk.int{border-left-style:dashed}
.live{text-align:center}
.phase{display:inline-block;font-weight:800;font-size:14px;letter-spacing:1px;border:2px solid var(--ink);border-radius:8px;padding:2px 10px}
.phase.rest{border-style:dashed}
.clock{font-size:80px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.05;margin:8px 0 2px}
.exname{font-size:23px;font-weight:800;margin:6px 0 2px}
.target{font-size:18px;margin:2px 0}
.bar{height:12px;border:2px solid var(--ink);border-radius:8px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:var(--acc)}
.rir{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rir button{min-height:52px;font-size:20px}
.rir button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);text-decoration:underline}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{min-width:56px;font-size:24px}
.stepper input{text-align:center;font-size:26px;font-weight:800}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.dots span{font-size:13px;border:2px solid var(--ink);border-radius:6px;padding:1px 7px;font-weight:700}
.dots span.todo{border-style:dotted;opacity:.6}
.dots span.now{outline:3px solid var(--acc);outline-offset:1px}
.hint{background:var(--ok-bg);border-radius:10px;padding:8px 10px;font-size:14px;text-align:left;margin:8px 0}
.warn{background:var(--warn-bg);color:var(--ink);border-left:5px solid var(--warn);border-radius:8px;padding:8px 10px;font-size:14px;margin:8px 0;text-align:left}
.tag{font-size:12px;font-weight:800;border:2px solid currentColor;border-radius:6px;padding:0 6px;white-space:nowrap;display:inline-block;margin-top:3px}
.tag.up::before{content:"▲ "} .tag.down::before{content:"▼ "} .tag.keep::before{content:"■ "}
.tag.down{border-style:dashed}
.list li{list-style:none;padding:8px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;z-index:9;display:none}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:8px}
.kpi b{font-size:22px;display:block}
.next{font-size:15px;margin-top:4px}
</style>
</head>
<body>
<header>
  <h1>Full Body JJB</h1>
  <span id="weekChip" class="chip">Sem –</span>
</header>
<main id="app"></main>
<nav>
  <button data-tab="hoy" aria-current="true">Hoy</button>
  <button data-tab="hist">Historial</button>
  <button data-tab="datos">Datos</button>
</nav>
<div id="toast" class="toast"></div>

<script>
"use strict";
/* =====================================================================
   PLAN v2 · Fuerza en superserie + circuito de combos por intervalos + core
   Bloque "sup": reps (lo–hi, tp = s por rep, uni = por lado, max = máx −2)
   Bloque "int": intervalos de trabajo/descanso; se cuentan reps por intervalo
   tag: leg / hinge / push / pull / core (se usa en las reglas del día)
   ===================================================================== */
const TRANS = 60, SIDE = 15, WARM = 240;
/* =====================================================================
   PLAN v3 · 30 ejercicios de los ejemplos (gymprimes, shainamarie,
   fabiovallejo, healthfitnessguide) + dominadas de apertura.
   Cada sesión: Apertura (dominadas) → Bloque 1 (5 ej.) → Bloque 2 (5 ej.)
   Intervalos 40"/20" (sem 1) → 45"/15" (sem 2–3) × 3 rondas.
   jump:1 → tiene versión silenciosa (alt) para entrenar temprano.
   ===================================================================== */
const DOM = (id,name)=>({t:"sup", name:"Apertura", rounds:3, rest:90, ex:[
  {id, name, max:1, lo:3, hi:8, tp:4, tag:"pull", cue:"Máximo −2 reps. Bajar en 3 s. Es el único tirón vertical: no lo saltes.", reg:"Banda azul en pie o negativas de 5 s"}]});
const PLAN = {
  A:{name:"FB-A", day:"Lunes", focus:"Dumbbell Power",
    warm:"Secuencia primal ×3 (beast → ape → crab) · rotación de hombros · 10 sentadillas sin peso",
    blocks:[
      DOM("A_dom","Dominada prona"),
      {t:"int", name:"Bloque 1 · Pierna + espalda", rounds:3, rr:30, ex:[
        {id:"A_front", name:"Sentadilla frontal 2 mancuernas", tag:"leg", cue:"Mancuernas en los hombros, codos altos, bajar a paralelo.", reg:"Goblet con una mancuerna"},
        {id:"A_row", name:"Remo inclinado 2 mancuernas", tag:"pull", cue:"Tronco a 45°, codos pegados, aprieta escápulas arriba.", reg:"Remo a una mano apoyado"},
        {id:"A_ohp", name:"Press militar de espaldas a la pared", tag:"push", cue:"Espalda y cabeza en la pared, sin arquear la zona lumbar.", reg:"Alterno, una mancuerna"},
        {id:"A_rdl", name:"Peso muerto rumano 2 mancuernas", tag:"hinge", cue:"Cadera atrás, mancuernas rozando las piernas, espalda neutra.", reg:"Rango hasta la rodilla"},
        {id:"A_mcdb", name:"Mountain climber sobre mancuernas", tag:"core", cue:"Manos en las mancuernas, rodilla al pecho rápida pero sin rebotar.", reg:"Lento, 2 s por rodilla"}]},
      {t:"int", name:"Bloque 2 · Hombro + core", rounds:3, rr:30, ex:[
        {id:"A_sumo", name:"Sentadilla sumo en pared + press al frente", tag:"leg", cue:"Espalda en la pared, mancuerna al pecho y empujas al frente arriba.", reg:"Sin press"},
        {id:"A_shrug", name:"Encogimientos con mancuernas", tag:"pull", cue:"Hombros a las orejas, pausa 1 s arriba, sin girar.", reg:"Más lento, sin peso extra"},
        {id:"A_sqlat", name:"Sentadilla + elevación lateral a 1 brazo", tag:"leg", cue:"Al subir, elevación lateral. Alterna brazo cada ronda.", reg:"Solo elevación"},
        {id:"A_klat", name:"Elevación lateral de rodillas", tag:"push", cue:"De rodillas, sin balanceo, hasta la altura del hombro.", reg:"Con goma o una mancuerna"},
        {id:"A_vup", name:"V-up", tag:"core", cue:"Brazos y piernas se encuentran arriba. Lumbar controlada.", reg:"V-up con rodillas dobladas"}]}
    ]},
  B:{name:"FB-B", day:"Miércoles", focus:"Athletic HIIT", note:"La más dura para las piernas: por eso va el miércoles, lejos del pádel.",
    warm:"Secuencia primal ×3 · Cossack 5/lado · tobillos y caderas 1'",
    blocks:[
      DOM("B_dom","Dominada supina"),
      {t:"int", name:"Bloque 1 · Potencia", rounds:3, rr:30, ex:[
        {id:"B_sqcurl", name:"Sentadilla profunda + curl", tag:"leg", cue:"Bajas con las 2 mancuernas, al subir curl de una. Alterna.", reg:"Una mancuerna"},
        {id:"B_dlmc", name:"Peso muerto → mountain climber", tag:"hinge", cue:"Bajas en bisagra, apoyas en las mancuernas, 4 climbers y subes.", reg:"Peso muerto → plancha 3 s"},
        {id:"B_pop", name:"Pop squats", jump:1, alt:"Sentadilla sumo con pausa y talones arriba", altCue:"Pies juntos → sumo abajo con pausa de 1 s, sin despegar.", tag:"leg", cue:"Saltas de pies juntos a sentadilla abierta. Aterriza suave.", reg:"Versión sin salto"},
        {id:"B_knee", name:"Rodilla arriba + rotación a 1 pierna", tag:"core", cue:"Mancuerna al frente, giras sobre la pierna de apoyo. Equilibrio de surf.", reg:"Punta del pie apoyada"},
        {id:"B_kneel", name:"De rodillas a salto", jump:1, alt:"De rodillas a de pie (sin salto)", altCue:"Rodillas → pie → pie → de pie. Explosivo pero sin despegar.", tag:"leg", cue:"Desde rodillas, pies al suelo y salto vertical. Aterriza suave.", reg:"Versión sin salto"}]},
      {t:"int", name:"Bloque 2 · Metabólico", rounds:3, rr:30, ex:[
        {id:"B_pusq", name:"Flexión → sentadilla profunda", tag:"push", cue:"Flexión, pies hacia las manos, te levantas desde la sentadilla.", reg:"Flexión con rodillas"},
        {id:"B_splitj", name:"Zancada partida con salto + rodilla arriba", jump:1, alt:"Zancada atrás + rodilla arriba", altCue:"Zancada atrás y subes llevando la rodilla al pecho. Alterna.", tag:"leg", cue:"Cambio de pierna en el aire y rodilla arriba al caer.", reg:"Versión sin salto"},
        {id:"B_dl", name:"Peso muerto con mancuernas", tag:"hinge", cue:"Rodillas algo flexionadas, mancuernas por los lados, empuja el suelo.", reg:"Rango corto"},
        {id:"B_toe", name:"Sentadilla + toque de pie cruzado", tag:"leg", cue:"Sentadilla, y al subir patada al frente y toque con la mano contraria.", reg:"Sin sentadilla"},
        {id:"B_situp", name:"Sit-up con mancuerna + giro", tag:"core", cue:"Mancuerna al pecho, pies anclados, giras al subir.", reg:"Sin mancuerna"}]}
    ]},
  C:{name:"FB-C", day:"Viernes", focus:"Primal Flow", note:"Sin mancuernas y sin saltos: silenciosa.",
    warm:"Secuencia primal ×3 (Fabio) · bear crawl 4 pasos ida y vuelta · muñecas 1'",
    blocks:[
      DOM("C_dom","Dominada neutra"),
      {t:"int", name:"Bloque 1 · Calistenia animal", rounds:3, rr:30, ex:[
        {id:"C_bear", name:"Flexión profunda en oso", tag:"push", cue:"Posición beast, rodillas a 2 cm, cabeza por delante de las manos.", reg:"Flexión normal"},
        {id:"C_curtsy", name:"Curtsy → zancada lateral", tag:"leg", cue:"Paso cruzado atrás y luego lateral. Alterna lado.", reg:"Solo zancada lateral"},
        {id:"C_climb", name:"Flexión trepa", tag:"push", cue:"Flexión y rodilla al codo al subir, alterna.", reg:"Sin flexión"},
        {id:"C_lunge", name:"Zancada atrás + giro + rodilla arriba", tag:"leg", cue:"Zancada atrás, giro del tronco hacia la pierna delantera, subes con rodilla arriba.", reg:"Sin giro"},
        {id:"C_saw", name:"Body saw → elevación de cadera", tag:"core", cue:"Antebrazos, desliza atrás y sube la cadera en pica.", reg:"Plancha con balanceo corto"}]},
      {t:"int", name:"Bloque 2 · Flow", rounds:3, rr:30, ex:[
        {id:"C_venom", name:"Flexión venom con desplazamiento", tag:"push", cue:"Desplazamiento bajo y lateral, flexión, vuelta. 5/lado es una buena referencia.", reg:"Bear crawl lateral"},
        {id:"C_heel", name:"Sentadilla + toque de talón cruzado", tag:"leg", cue:"Sentadilla y al subir talón atrás a la mano contraria.", reg:"Sentadilla al aire"},
        {id:"C_pike", name:"Flexión pica + toque de rodilla cruzado", tag:"push", cue:"Pike push-up y rodilla a la mano contraria.", reg:"Pica sin flexión"},
        {id:"C_commando", name:"Flexión → plancha comando", tag:"push", cue:"Flexión, bajas a antebrazos y vuelves a manos. Alterna el brazo que inicia.", reg:"Rodillas apoyadas"},
        {id:"C_bike", name:"Bicicleta → elevación de piernas", tag:"core", cue:"4 bicis + 1 elevación de piernas. Lumbar pegada.", reg:"Solo bicis"}]}
    ]}
};
for(const k in PLAN) PLAN[k].blocks.forEach(b=>b.ex.forEach(e=>e.mode = b.t==="int"?"time":"reps"));

const MODS = [
  {id:"silencio", label:"Silencio (temprano)", fx:"Los saltos pasan a su versión sin impacto"},
  {id:"sueno", label:"Dormí menos de 6 h", fx:"−1 ronda en todo y RIR 3"},
  {id:"padel", label:"Pádel intenso ayer", fx:"Fuera los ejercicios de rodilla"},
  {id:"mar",   label:"Surf o kite de más de 2 h (ayer u hoy)", fx:"Dominadas a 2 series y sin peso muerto"},
  {id:"dolor", label:"Molestia articular > 3/10", fx:"Usa la regresión en lo que moleste"},
  {id:"t20",   label:"Solo tengo 20 minutos", fx:"Calentamiento 3' + bloque 1, 2 rondas"}
];
// Progresión semanal: una variable por semana
const WEEK = {1:{w:40,r:20,cr:3,dom:3,txt:"40\"/20\" × 3 rondas · anota reps"},
              2:{w:45,r:15,cr:3,dom:3,txt:"45\"/15\" × 3 rondas (más densidad)"},
              3:{w:45,r:15,cr:3,dom:4,txt:"45\"/15\" · dominadas a 4 series · sube carga donde marque ▲"},
              4:{w:40,r:20,cr:2,dom:2,txt:"Descarga: 2 rondas"}};

/* ============ STORAGE ============ */
const KEY = "fbjjb_v1";
let DB = load();
function blank(){ return {start:null, sessions:[], acts:[], weights:[], live:null, settings:{sound:false, vib:true}}; }
function load(){
  try{ const d = JSON.parse(localStorage.getItem(KEY)); if(d && d.sessions){ const o=Object.assign(blank(), d); if(o.live && !o.live.v2) o.live=null; return o; } }catch(e){}
  return blank();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){ toast("No se pudo guardar en este navegador"); } }
if(!DB.start){ DB.start = isoDate(new Date()); save(); }

/* ============ HELPERS ============ */
function isoDate(d){ const z=new Date(d.getTime()-d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); }
function fmt(s){ s=Math.max(0,Math.round(s)); const m=Math.floor(s/60), r=s%60; return m+":"+String(r).padStart(2,"0"); }
function mins(s){ return Math.round(s/60)+"'"; }
function esc(t){ return String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function $(s){ return document.querySelector(s); }
function weekInfo(date=new Date()){
  const days = Math.floor((new Date(isoDate(date)) - new Date(DB.start))/86400000);
  const w = Math.max(0,days);
  return {week:(Math.floor(w/7)%4)+1, cycle:Math.floor(w/28)+1};
}
function rirTarget(week, mods){ if(mods && mods.includes("sueno")) return "3"; return week===1?"3":week===4?"3 (descarga)":"1–2"; }
function repTxt(e){
  if(e.max) return "máx −2 reps";
  return (e.lo===e.hi?e.lo:e.lo+"–"+e.hi)+" reps"+(e.uni?" por lado":"");
}
function findEx(id){ for(const k in PLAN) for(const b of PLAN[k].blocks){ let e=b.ex.find(x=>x.id===id); if(e) return e; e=b.ex.find(x=>x.jump && x.id+"_s"===id); if(e) return Object.assign({}, e, {id, name:e.alt, cue:e.altCue, jump:0}); } return null; }

/* ============ CONSTRUCCIÓN DEL PLAN DEL DÍA ============ */
function buildPlan(key, mods){
  const P = PLAN[key], wk = weekInfo().week, W = WEEK[wk], notes = [];
  let warm = WARM;
  let blocks = P.blocks.map(b=>Object.assign({}, b, {ex:b.ex.map(e=>Object.assign({}, e))}));
  // semana
  blocks.forEach(b=>{ if(b.t==="int") b.rounds = W.cr; else b.rounds = W.dom; });
  // silencio: saltos → versión sin impacto
  if(mods.includes("silencio")) blocks.forEach(b=>b.ex=b.ex.map(e=>e.jump?Object.assign({}, e, {id:e.id+"_s", name:e.alt, cue:e.altCue, jump:0}):e));
  // reglas del día
  if(mods.includes("sueno")){ blocks.forEach(b=>b.rounds=Math.max(1,b.rounds-1)); notes.push("Mal sueño: −1 ronda en todo, RIR 3"); }
  if(mods.includes("padel")){ blocks.forEach(b=>{ const out=b.ex.filter(e=>e.tag==="leg"); if(out.length) notes.push("Sin "+out.map(e=>e.name).join(" · ")+" (pádel)"); b.ex=b.ex.filter(e=>e.tag!=="leg"); }); }
  if(mods.includes("mar")){ blocks.forEach(b=>{ const out=b.ex.filter(e=>e.tag==="hinge"); if(out.length) notes.push("Sin "+out.map(e=>e.name).join(" · ")+" (mar)"); b.ex=b.ex.filter(e=>e.tag!=="hinge"); if(b.t==="sup") b.rounds=Math.min(b.rounds,2); }); notes.push("Dominadas a 2 series (espalda cargada del mar)"); }
  if(mods.includes("t20")){ blocks = blocks.filter(b=>b.t==="int").slice(0,1); blocks[0].rounds = Math.min(2, blocks[0].rounds); warm = 180; notes.push("20': solo el bloque 1, 2 rondas"); }
  if(mods.includes("dolor")) notes.push("Molestia: usa la regresión del ejercicio que moleste");
  blocks = blocks.filter(b=>b.ex.length && b.rounds>0);
  const steps = [];
  blocks.forEach((b,bi)=>{
    for(let r=0;r<b.rounds;r++) b.ex.forEach((e,ei)=>{
      const lastEx = ei===b.ex.length-1, lastR = r===b.rounds-1;
      const s = {bi, bname:b.name, kind:b.t==="int"?"time":"reps", e, r, rounds:b.rounds};
      if(s.kind==="time"){ s.work=W.w; s.rest = W.r + (lastEx && !lastR ? (b.rr||0) : 0); }
      else s.rest = b.rest;
      if(lastEx && lastR) s.rest = bi<blocks.length-1 ? TRANS : 0;
      steps.push(s);
    });
  });
  return {key, blocks, steps, warm, notes, mods, week:wk, rir:rirTarget(wk,mods), W};
}
function stepWork(s){ if(s.kind==="time") return s.work; const e=s.e; return (e.max?8:e.hi)*e.tp*(e.uni?2:1)+(e.uni?SIDE:0); }
function estimate(plan){ return plan.warm + plan.steps.reduce((a,s)=>a+stepWork(s)+s.rest, 0); }

/* ============ HISTORIAL Y PROGRESIÓN ============ */
function logsFor(exId){
  const out=[]; DB.sessions.slice().sort((a,b)=>b.end-a.end).forEach(s=>{ const x=s.ex.find(e=>e.id===exId); if(x && x.sets.length) out.push({date:s.date, sets:x.sets}); });
  return out;
}
function lastHint(e){
  const l = logsFor(e.id)[0]; if(!l) return "Primera vez: anota reps y peso/variante.";
  const v = l.sets[l.sets.length-1].var;
  if(e.mode==="time") return "Última ("+l.date.slice(5)+"): "+l.sets.map(s=>s.reps).join(" · ")+(e.iso?" s":" reps")+(v?" · "+v:"");
  return "Última ("+l.date.slice(5)+"): "+l.sets.map(s=>s.reps).join(" · ")+" · RIR mín "+Math.min(...l.sets.map(s=>s.rir??3))+(v?" · "+v:"");
}
function progress(e){
  const L = logsFor(e.id).slice(0,2);
  if(L.length<2) return {k:"keep", t:"Sin datos suficientes"};
  if(e.mode==="time"){
    const held = l => l.sets.length>=2 && l.sets[l.sets.length-1].reps >= l.sets[0].reps;
    const crash = l => l.sets.length>=2 && l.sets[l.sets.length-1].reps < 0.7*l.sets[0].reps;
    if(L.every(held)) return {k:"up", t:"SUBE: más peso o variante más difícil"};
    if(crash(L[0])) return {k:"down", t:"BAJA: variante más fácil"};
    return {k:"keep", t:"MANTÉN: +1 rep por intervalo"};
  }
  if(e.max) return {k:"keep", t:"MANTÉN: busca +1 rep en la mejor serie"};
  const top = L.every(l=>l.sets.every(s=>s.reps>=e.hi) && Math.min(...l.sets.map(s=>s.rir??0))>=2);
  const low = L.every(l=>l.sets.some(s=>s.reps<e.lo));
  if(top) return {k:"up", t:"SUBE: variante más difícil o tempo más lento"};
  if(low) return {k:"down", t:"BAJA: variante más fácil"};
  return {k:"keep", t:"MANTÉN: busca +1 rep"};
}

/* ============ AUDIO / VIBRACIÓN / PANTALLA ============ */
let actx=null, wakeLock=null;
function beep(freq=880, dur=.15){
  if(!DB.settings.sound) return;
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=freq; o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(.25, actx.currentTime); g.gain.exponentialRampToValueAtTime(.001, actx.currentTime+dur);
    o.start(); o.stop(actx.currentTime+dur); }catch(e){}
}
function buzz(p){ if(DB.settings.vib && navigator.vibrate) try{ navigator.vibrate(p); }catch(e){} }
async function keepAwake(on){
  try{ if(on && "wakeLock" in navigator && !wakeLock){ wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release",()=>wakeLock=null); }
       if(!on && wakeLock){ await wakeLock.release(); wakeLock=null; } }catch(e){}
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && DB.live) keepAwake(true); });
function toast(t){ const el=$("#toast"); el.textContent=t; el.style.display="block"; clearTimeout(toast.h); toast.h=setTimeout(()=>el.style.display="none",2200); }

function trend(){
  if(DB.weights.length<2) return "";
  const a=DB.weights[0], b=DB.weights[DB.weights.length-1];
  const wk = Math.max(1,(new Date(b.date)-new Date(a.date))/6048e5);

  return " · "+(r>0?"+":"")+r.toFixed(2)+" kg/sem → "+ok;
}

/* ============ SESIÓN EN VIVO ============ */
function startSession(plan){
  DB.live = {v2:1, id:uid(), key:plan.key, date:isoDate(new Date()), start:Date.now(), plan, est:estimate(plan),
    ph:"warm", t0:Date.now(), dur:plan.warm, idx:0, logs:{}, pend:null, paused:null};
  save(); keepAwake(true); beep(660); buzz(80); render();
}
let tickH=null, lastBeepSec=-1;
function startTick(){ if(!tickH) tickH=setInterval(tick, 250); }
function stopTick(){ if(tickH){ clearInterval(tickH); tickH=null; } }
function cur(){ const L=DB.live; return L.plan.steps[L.idx]; }
function tick(){
  const L = DB.live; if(!L) return stopTick();
  const now = L.paused || Date.now(), el = (now-L.t0)/1000;
  const tot=$("#tot"); if(tot) tot.textContent = fmt((Date.now()-L.start)/1000);
  const c=$("#clk"), bar=$("#bar"), s=cur();
  const countdown = (dur, onEnd)=>{
    const left = Math.ceil(dur - el);
    if(c) c.textContent = fmt(left);
    if(bar) bar.style.width = Math.min(100, el/dur*100)+"%";
    if(left<=3 && left>0 && left!==lastBeepSec){ lastBeepSec=left; beep(660,.1); if(left===3) buzz(60); }
    if(left<=0){ lastBeepSec=-1; beep(990,.35); buzz([200,100,200]); onEnd(); }
  };
  if(L.ph==="warm" || L.ph==="rest") countdown(L.dur, endRest);
  else if(L.ph==="work" && s.kind==="time") countdown(s.work, endWork);
  else if(L.ph==="work"){ if(c) c.textContent = fmt(el); if(bar) bar.style.width = Math.min(100, el/stepWork(s)*100)+"%"; }
}
function prevVals(e){
  const mine = (DB.live.logs[e.id]||{sets:[]}).sets;
  if(mine.length) return mine[mine.length-1];
  const h = logsFor(e.id)[0]; if(h) return h.sets[Math.min(DB.live.plan.steps[DB.live.idx].r, h.sets.length-1)];
  return null;
}
function logPush(s, entry){
  const L=DB.live; L.logs[s.e.id] = L.logs[s.e.id] || {id:s.e.id, name:s.e.name, mode:s.kind, sets:[]};
  L.logs[s.e.id].sets.push(Object.assign({round:s.r+1}, entry));
}
function commitPend(){
  const L=DB.live, s=cur(); if(!L.pend) return;
  logPush(s, {reps:+L.pend.reps||0, var:L.pend.var||"", workSec:s.work}); L.pend=null;
}
function goStep(i){
  const L=DB.live; L.idx=i; L.paused=null;
  if(i>=L.plan.steps.length){ finishSession(); return; }
  const s=cur(), prev=L.plan.steps[i-1];
  if(s.kind==="time" && prev && prev.bi===s.bi){ L.ph="work"; beep(880,.2); buzz(120); }
  else L.ph="ready";
  L.t0=Date.now(); save(); renderLive();
}
function endRest(){
  const L=DB.live;
  if(L.ph==="warm"){ goStep(0); return; }
  if(cur().kind==="time") commitPend();
  goStep(L.idx+1);
}
function endWork(){
  const L=DB.live, s=cur();
  if(s.kind==="time"){
    const p = prevVals(s.e);
    L.pend = {reps: p ? p.reps : (s.e.iso? s.work : 10), var: p ? (p.var||"") : ""};
    if(s.rest>0){ L.ph="rest"; L.dur=s.rest; } else L.ph="log";
  } else { L.workSec = Math.round((Date.now()-L.t0)/1000); L.ph="log"; L.pend={rir:2}; }
  L.t0=Date.now(); save(); renderLive();
}
function dotsHtml(s){
  const L=DB.live, done=(L.logs[s.e.id]||{sets:[]}).sets;
  return Array.from({length:s.rounds},(_,k)=>{ const d=done[k];
    return `<span class="${d?"":"todo"} ${k===s.r && !d?"now":""}">${d?(d.reps+(s.kind==="reps"?"@"+d.rir:(s.e.iso?"s":""))):"R"+(k+1)}</span>`; }).join("");
}
function nextName(){ const L=DB.live, n=L.plan.steps[L.idx+1]; return n ? n.e.name+(n.bi!==cur().bi?" (bloque "+n.bname+")":"") : "Fin de la sesión"; }
function renderLive(){
  const L = DB.live; startTick(); keepAwake(true);
  const s = cur();
  let h = `<div class="row" style="justify-content:space-between;margin-bottom:8px">
     <span class="chip">${PLAN[L.key].name}${s&&L.ph!=="warm"?" · "+esc(s.bname)+" · ronda "+(s.r+1)+"/"+s.rounds:""}</span>
     <span class="mute">Total <b id="tot" class="num">0:00</b> / ~${mins(L.est)}</span></div>`;
  if(L.ph==="warm"){
    h += `<div class="card live"><span class="phase rest">CALENTAMIENTO</span>
      <div class="clock" id="clk">${fmt(L.dur)}</div><div class="bar"><i id="bar" style="width:0"></i></div>
      <div class="hint">${esc(PLAN[L.key].warm)}</div>
      <button class="pri big" id="skip">Calentamiento hecho →</button></div>`;
  } else {
    const e = s.e;
    h += `<div class="card live"><div class="exname">${esc(e.name)}</div>
      <div class="target">${s.kind==="reps"?"<b>"+repTxt(e)+"</b> · RIR "+esc(L.plan.rir):"<b>"+s.work+"\" a buen ritmo</b> · cuenta "+(e.iso?"segundos":"reps")}</div>
      <div class="dots">${dotsHtml(s)}</div>`;
    if(L.ph==="ready"){
      h += `<span class="phase">LISTO</span>
        <div class="hint">${esc(e.cue)}<br><b>${esc(lastHint(e))}</b><br><span class="mute">Regresión: ${esc(e.reg)}</span></div>
        <button class="pri big" id="startW">▶ ${s.kind==="time"?"Empezar intervalo":"Empezar serie"}</button>`;
    } else if(L.ph==="work"){
      h += `<span class="phase">${s.kind==="time"?"¡TRABAJO!":"EN SERIE"}</span>
        <div class="clock" id="clk">${s.kind==="time"?fmt(s.work):"0:00"}</div><div class="bar"><i id="bar" style="width:0"></i></div>
        <div class="hint">${esc(e.cue)}</div>
        ${s.kind==="reps"?`<button class="pri big" id="endW">■ Serie hecha</button>`:`<button class="big" id="pause">${L.paused?"▶ Seguir":"⏸ Pausa"}</button>`}`;
    } else if(L.ph==="rest" || L.ph==="log"){
      if(s.kind==="time" && L.pend){
        h += `<span class="phase rest">${L.ph==="rest"?"DESCANSO":"REGISTRAR"}</span>
          ${L.ph==="rest"?`<div class="clock" id="clk">${fmt(L.dur)}</div><div class="bar"><i id="bar" style="width:0"></i></div>`:""}
          <label>${e.iso?"Segundos aguantados":"Reps en este intervalo"}</label>
          <div class="stepper"><button id="rm">−</button><input id="reps" type="number" inputmode="numeric" value="${esc(L.pend.reps)}"><button id="rp">+</button></div>
          <label>Peso / variante</label><input id="var" value="${esc(L.pend.var)}" placeholder="ej. 2×11 kg · sin rodillas">
          <div class="next"><b>Siguiente:</b> ${esc(nextName())}</div>
          ${L.ph==="rest"?`<div class="row" style="margin-top:10px"><button class="grow" id="plus">+15 s</button><button class="pri grow" id="skip">Siguiente →</button></div>`
                          :`<button class="pri big" id="saveT" style="margin-top:10px">✓ Guardar</button>`}`;
      } else if(L.ph==="log"){
        const p = prevVals(e) || {};
        h += `<span class="phase">REGISTRAR SERIE</span>
          <label>Repeticiones${e.uni?" (por lado, el peor)":""}</label>
          <div class="stepper"><button id="rm">−</button><input id="reps" type="number" inputmode="numeric" value="${p.reps ?? (e.max?5:e.hi)}"><button id="rp">+</button></div>
          <label>RIR (repeticiones que te sobraban)</label>
          <div class="rir">${[0,1,2,3,4].map(r=>`<button data-rir="${r}" aria-pressed="${r===L.pend.rir}">${r}${r===4?"+":""}</button>`).join("")}</div>
          <label>Variante / banda / peso</label><input id="var" value="${esc(p.var||"")}" placeholder="ej. banda azul · 2×11 kg">
          <button class="pri big" id="saveR" style="margin-top:12px">✓ Guardar y descansar</button>`;
      } else {
        h += `<span class="phase rest">DESCANSO</span>
          <div class="clock" id="clk">${fmt(L.dur)}</div><div class="bar"><i id="bar" style="width:0"></i></div>
          <div class="next"><b>Siguiente:</b> ${esc(nextName())}</div>
          <div class="row" style="margin-top:10px"><button class="grow" id="plus">+15 s</button><button class="pri grow" id="skip">Siguiente →</button></div>`;
      }
    }
    h += `</div>`;
  }
  h += `<div class="row"><button class="grow sm" id="skipStep">Saltar paso</button><button class="grow sm" id="finish">Terminar sesión</button></div>`;
  $("#app").innerHTML = h; tick();
  const on=(id,f)=>{ const b=$("#"+id); if(b) b.onclick=f; };
  on("skip", endRest);
  on("plus", ()=>{ L.dur+=15; save(); });
  on("startW", ()=>{ L.ph="work"; L.t0=Date.now(); beep(880,.15); buzz(80); save(); renderLive(); });
  on("endW", endWork);
  on("pause", ()=>{ if(L.paused){ L.t0 += Date.now()-L.paused; L.paused=null; } else L.paused=Date.now(); save(); renderLive(); });
  on("rm", ()=>{ const i=$("#reps"); i.value=Math.max(0,(+i.value||0)-1); i.dispatchEvent(new Event("input")); });
  on("rp", ()=>{ const i=$("#reps"); i.value=(+i.value||0)+1; i.dispatchEvent(new Event("input")); });
  if(s && s.kind==="time" && L.pend){
    const r=$("#reps"), v=$("#var");
    if(r) r.oninput=()=>{ L.pend.reps=+r.value||0; save(); };
    if(v) v.oninput=()=>{ L.pend.var=v.value; save(); };
  }
  document.querySelectorAll("[data-rir]").forEach(b=>b.onclick=()=>{ L.pend.rir=+b.dataset.rir;
    document.querySelectorAll("[data-rir]").forEach(x=>x.setAttribute("aria-pressed", String(x===b))); });
  on("saveR", ()=>{
    const reps=+$("#reps").value;
    logPush(s, {reps, rir:L.pend.rir, var:$("#var").value.trim(), workSec:L.workSec});
    L.pend=null;
    if(s.rest>0){ L.ph="rest"; L.dur=s.rest; L.t0=Date.now(); lastBeepSec=-1; save(); renderLive(); }
    else goStep(L.idx+1);
  });
  on("saveT", ()=>{ commitPend(); goStep(L.idx+1); });
  on("skipStep", ()=>{ L.pend=null; goStep(L.ph==="warm"?0:L.idx+1); });
  on("finish", ()=>{ if(confirm("¿Terminar y guardar la sesión?")){ if(L.pend && cur() && cur().kind==="time") commitPend(); finishSession(); } });
}
function finishSession(){
  const L = DB.live; if(!L) return;
  const rec = {id:L.id, key:L.key, v:2, date:L.date, start:L.start, end:Date.now(), durSec:Math.round((Date.now()-L.start)/1000),
    estSec:L.est, week:L.plan.week, mods:L.plan.mods, rir:L.plan.rir, ex:Object.values(L.logs).filter(x=>x.sets.length), notes:""};
  DB.sessions.push(rec); DB.live=null; save(); keepAwake(false); stopTick(); beep(880,.3); buzz([100,60,100]);
  VIEW={k:"sum", id:rec.id}; render();
}

/* ============ RESUMEN ============ */
function renderSummary(id){
  const s = DB.sessions.find(x=>x.id===id); if(!s){ VIEW=null; return render(); }
  const p = PLAN[s.key], diff = s.durSec - s.estSec;
  const verdict = s.durSec>45*60 ? {t:"Pasas de 45': quita 1 ronda del circuito", c:"down"} :
                  s.durSec<35*60 ? {t:"Por debajo de 35': cabe 1 ronda más de circuito", c:"up"} :
                                   {t:"Dentro de 35–45'", c:"keep"};
  let h = `<div class="card"><h2>${p.name} · ${s.date}</h2>
    <div class="kpis"><div class="kpi"><b>${fmt(s.durSec)}</b><span class="mute">real</span></div>
      <div class="kpi"><b>${fmt(s.estSec)}</b><span class="mute">calculado (${diff>=0?"+":""}${Math.round(diff/60)}')</span></div></div>
    <div style="margin-top:8px"><span class="tag ${verdict.c}">${verdict.c==="up"?"CABE MÁS":verdict.c==="down"?"SE PASA":"OK"}</span> ${verdict.t}</div>
    ${s.mods&&s.mods.length?`<div class="mute" style="margin-top:6px">Reglas aplicadas: ${s.mods.map(m=>MODS.find(x=>x.id===m)?.label).join(" · ")}</div>`:""}</div>
  <div class="card"><h3>Registro</h3><table><tr><th>Ejercicio</th><th>Por ronda</th><th class="num">Total</th></tr>`;
  s.ex.forEach(x=>{ const e = findEx(x.id); const pr = e?progress(e):{k:"keep",t:""};
    const per = x.mode==="time" ? x.sets.map(z=>z.reps).join(" · ") : x.sets.map(z=>z.reps+"@"+z.rir).join(" · ");
    const tot = x.sets.reduce((a,z)=>a+(+z.reps||0),0);
    h += `<tr><td><b>${esc(x.name)}</b><br><span class="mute">${esc(x.sets.slice(-1)[0].var||"")}</span><br><span class="tag ${pr.k}">${esc(pr.t)}</span></td>
      <td>${per}</td><td class="num">${tot}</td></tr>`; });
  h += `</table></div>
  <div class="card"><label>Notas (molestias, sensaciones, cambios)</label><textarea id="notes" rows="3">${esc(s.notes)}</textarea>
    <button class="pri big" id="saveN" style="margin-top:10px">Guardar notas</button></div>
  <div class="row"><button class="grow" id="back">← Volver</button><button class="grow" id="del">Borrar sesión</button></div>`;
  $("#app").innerHTML = h; window.scrollTo(0,0);
  $("#saveN").onclick=()=>{ s.notes=$("#notes").value; save(); toast("Notas guardadas"); };
  $("#back").onclick=()=>{ VIEW=null; render(); };
  $("#del").onclick=()=>{ if(confirm("¿Borrar esta sesión del registro?")){ DB.sessions=DB.sessions.filter(x=>x.id!==id); save(); VIEW=null; render(); } };
}

/* ============ HISTORIAL ============ */
function renderHist(){
  const ss = DB.sessions.slice().sort((a,b)=>b.end-a.end);
  let h = `<div class="card"><h2>Sesiones (${ss.length})</h2>`;
  if(!ss.length) h += `<div class="mute">Aún no hay sesiones. La semana 1 fija tus referencias de reps por intervalo.</div>`;
  else { h+=`<ul class="list">`; ss.forEach(s=>{ const over=s.durSec>2700;
    h+=`<li><button class="sessbtn" style="width:100%" data-id="${s.id}"><span><b>${PLAN[s.key]?PLAN[s.key].name:s.key}</b> · ${s.date}<br><span class="mute">Sem ${s.week} · ${s.ex.reduce((a,x)=>a+x.sets.length,0)} series/intervalos</span></span>
      <span class="num">${fmt(s.durSec)}${over?'<br><span class="tag down">&gt;45\'</span>':""}</span></button></li>`; }); h+=`</ul>`; }
  h += `</div><div class="card"><h2>Progresión por ejercicio</h2><table><tr><th>Ejercicio</th><th>Últimas</th><th>Decisión</th></tr>`;
  ["A","B","C"].forEach(k=>PLAN[k].blocks.forEach(b=>b.ex.forEach(e=>{ const L=logsFor(e.id).slice(0,3); if(!L.length) return; const pr=progress(e);
    h+=`<tr><td><b>${PLAN[k].name}</b> ${esc(e.name)}</td><td class="mute">${L.map(l=>l.sets.map(s=>s.reps).join("·")).join("<br>")}</td><td><span class="tag ${pr.k}">${esc(pr.t.split(":")[0])}</span></td></tr>`; })));
  h += `</table></div><div class="card"><h2>Deporte y cardio</h2>`;
  const aa = DB.acts.slice().reverse().slice(0,30);
  h += aa.length ? `<table>${aa.map(a=>`<tr><td>${a.date.slice(5)}</td><td><b>${esc(a.type)}</b><br><span class="mute">${esc(a.note||"")}</span></td><td class="num">${a.min}'</td><td>${a.int}</td><td><button class="sm" data-da="${a.id}" aria-label="Borrar">✕</button></td></tr>`).join("")}</table>` : `<div class="mute">Sin actividades registradas.</div>`;
  h += `</div>`;
  $("#app").innerHTML = h;
  document.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>{ VIEW={k:"sum", id:b.dataset.id}; render(); });
  document.querySelectorAll("[data-da]").forEach(b=>b.onclick=()=>{ if(confirm("¿Borrar actividad?")){ DB.acts=DB.acts.filter(a=>a.id!==b.dataset.da); save(); render(); } });
}

/* ============ DATOS ============ */
function renderData(){
  const h = `<div class="card"><h2>Ciclo</h2>
    <label>Fecha de inicio (lunes de la semana 1)</label><input id="start" type="date" value="${DB.start}">
    <button id="saveStart" style="margin-top:8px">Guardar fecha</button>
    <table style="margin-top:10px">${[1,2,3,4].map(w=>`<tr><td><b>Sem ${w}</b></td><td>${WEEK[w].txt}</td></tr>`).join("")}</table></div>
  <div class="card"><h2>Avisos</h2>
    <label class="check"><input type="checkbox" id="sound" ${DB.settings.sound?"checked":""}><span><b>Sonido</b> en los cambios de intervalo<br><span class="mute">Apágalo por la mañana</span></span></label>
    <label class="check"><input type="checkbox" id="vib" ${DB.settings.vib?"checked":""}><span><b>Vibración</b> en los cambios de intervalo<br><span class="mute">Android sí; iPhone no la permite en web</span></span></label></div>
  <div class="card"><h2>Copia de seguridad</h2>
    <div class="mute">Los datos viven en este navegador. Exporta cada semana.</div>
    <button class="pri big" id="expJ" style="margin-top:10px">Exportar copia (JSON)</button>
    <div class="row" style="margin-top:8px"><button class="grow" id="expC">Series (CSV)</button><button class="grow" id="expA">Actividades (CSV)</button></div>
    <label style="margin-top:12px">Importar copia (JSON)</label><input id="imp" type="file" accept="application/json,.json"></div>
  <div class="card"><h2>Tiempos del plan (semana actual)</h2>
    <table>${["A","B","C"].map(k=>`<tr><td><b>${PLAN[k].name}</b> ${PLAN[k].focus}</td><td class="num">${fmt(estimate(buildPlan(k,[])))}</td></tr>`).join("")}</table></div>`;
  $("#app").innerHTML = h;
  $("#saveStart").onclick=()=>{ if($("#start").value){ DB.start=$("#start").value; save(); toast("Fecha guardada"); render(); } };
  $("#sound").onchange=e=>{ DB.settings.sound=e.target.checked; save(); if(e.target.checked) beep(); };
  $("#vib").onchange=e=>{ DB.settings.vib=e.target.checked; save(); buzz(80); };
  $("#expJ").onclick=()=>download("fullbody_jjb_"+isoDate(new Date())+".json", JSON.stringify(Object.assign({}, DB, {live:null}), null, 1), "application/json");
  $("#expC").onclick=()=>{ const rows=[["fecha","sesion","semana","ejercicio","modo","ronda","reps","rir","variante","trabajo_s","duracion_sesion_s"]];
    DB.sessions.forEach(s=>s.ex.forEach(x=>x.sets.forEach((z,i)=>rows.push([s.date,PLAN[s.key]?PLAN[s.key].name:s.key,s.week,x.name,x.mode||"reps",z.round||i+1,z.reps,z.rir??"",z.var,z.workSec??"",s.durSec]))));
    download("series_"+isoDate(new Date())+".csv", toCSV(rows), "text/csv"); };
  $("#expA").onclick=()=>{ const rows=[["fecha","tipo","minutos","intensidad","nota"]]; DB.acts.forEach(a=>rows.push([a.date,a.type,a.min,a.int,a.note]));
    DB.weights.forEach(w=>rows.push([w.date,"Peso corporal",w.kg,"",""]));
    download("actividades_"+isoDate(new Date())+".csv", toCSV(rows), "text/csv"); };
  $("#imp").onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.sessions) throw 0;
      const merge=(a,b,k)=>{ const ids=new Set(a.map(x=>x[k])); b.forEach(x=>{ if(!ids.has(x[k])) a.push(x); }); };
      merge(DB.sessions,d.sessions,"id"); merge(DB.acts,d.acts||[],"id"); merge(DB.weights,d.weights||[],"date");
      if(d.start) DB.start=d.start; save(); toast("Copia importada"); render(); }catch(err){ toast("Archivo no válido"); } };
    r.readAsText(f); };
}
function toCSV(rows){ return "﻿"+rows.map(r=>r.map(v=>{ v=String(v??""); return /[;",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(";")).join("\n"); }
function download(name, text, type){
  const blob=new Blob([text],{type}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

render();
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
</script>
</body>
</html>
