<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101722">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Full Body JJB</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f4f1ea; --card:#ffffff; --ink:#151a22; --mute:#5b6270; --line:#d5d0c4;
  --acc:#0072B2; --acc-ink:#ffffff; --warn:#8a5a00; --warn-bg:#fff2d6;
  --ok-bg:#e3effa; --radius:14px;
  /* Paleta Okabe-Ito (apta para daltonismo) */
  --c-orange:#E69F00; --c-sky:#56B4E9; --c-green:#009E73; --c-yellow:#F0E442;
  --c-blue:#0072B2; --c-verm:#D55E00; --c-purple:#CC79A7; --c-ink:#111;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0f141c; --card:#18202c; --ink:#eef1f6; --mute:#a3abb8; --line:#2c3644;
  --acc:#56B4E9; --acc-ink:#0f141c; --warn:#ffc861; --warn-bg:#3a2e14; --ok-bg:#1b2e40;
  --c-blue:#2b8fd6;}
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:0 0 calc(76px + env(safe-area-inset-bottom));min-height:100vh}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 10px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:8px}
header h1{font-size:19px;letter-spacing:.2px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;border:2px solid var(--ink);
  border-radius:999px;padding:2px 10px;white-space:nowrap}
.chip.dash{border-style:dashed}
main{padding:12px 16px;max-width:680px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:0 0 12px}
h2{font-size:17px;margin:4px 0 8px}
h3{font-size:15px;margin:0 0 4px}
.mute{color:var(--mute);font-size:14px}
.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
button{font:inherit;cursor:pointer;border-radius:12px;border:2px solid var(--ink);background:transparent;color:var(--ink);
  padding:10px 14px;font-weight:700;min-height:46px}
button.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
button.big{width:100%;font-size:19px;min-height:62px}
button.sm{min-height:36px;padding:4px 10px;font-size:14px}
button.icon{min-width:44px;padding:4px 8px}
.sess{display:grid;grid-template-columns:1fr;gap:10px}
.sessbtn{text-align:left;display:flex;justify-content:space-between;align-items:center;background:var(--card);border:2px solid var(--line);gap:8px;width:100%}
.sessbtn b{font-size:17px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
select{padding-right:6px}
label{font-size:14px;color:var(--mute);display:block;margin:6px 0 3px}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.check:first-of-type{border-top:0}
.check input{width:24px;height:24px;flex:none;margin-top:1px}
.chk{display:inline-flex;gap:6px;align-items:center;border:2px solid var(--line);border-radius:10px;padding:6px 10px;font-size:14px;margin:0 6px 6px 0;color:var(--ink)}
.chk input{width:18px;height:18px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mute);font-weight:600}
.num{text-align:right;font-variant-numeric:tabular-nums}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--line);
  display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;min-height:52px;font-size:14px;border-radius:10px}
nav button{border-top:4px solid var(--tc);border-radius:0 0 10px 10px;display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.15}
nav button .ic{font-size:18px}
nav button[aria-current="true"]{background:var(--tc);color:var(--tk);text-decoration:underline;text-underline-offset:4px}
nav [data-tab=hoy]{--tc:var(--c-blue);--tk:#fff} nav [data-tab=lib]{--tc:var(--c-green);--tk:#fff}
nav [data-tab=hist]{--tc:var(--c-orange);--tk:#111} nav [data-tab=datos]{--tc:var(--c-purple);--tk:#111}
header{border-bottom:4px solid var(--hc,var(--c-blue))}
body[data-tab=lib]{--hc:var(--c-green)} body[data-tab=hist]{--hc:var(--c-orange)} body[data-tab=datos]{--hc:var(--c-purple)}
.card{border-top:4px solid var(--hc,var(--c-blue))}
/* etiquetas por tipo de actividad: color + texto siempre */
.tg{display:inline-block;font-size:10px;font-weight:800;border-radius:4px;padding:0 3px;line-height:1.3;border:1px solid var(--c-ink);background:var(--tb);color:var(--tt)}
.tg.FB{--tb:var(--c-blue);--tt:#fff} .tg.SURF{--tb:var(--c-sky);--tt:#111} .tg.KITE{--tb:var(--c-green);--tt:#fff}
.tg.PÁD{--tb:var(--c-orange);--tt:#111} .tg.ESQ{--tb:var(--c-purple);--tt:#111} .tg.RUN{--tb:var(--c-verm);--tt:#fff}
.tg.ELÍP{--tb:var(--c-yellow);--tt:#111} .tg.PAS{--tb:#b9b9b9;--tt:#111} .tg.OTR{--tb:#666;--tt:#fff}
.kpis .kpi{border-top:4px solid var(--c-sky)} .kpis .kpi:nth-child(2){border-top-color:var(--c-yellow)} .kpis .kpi:nth-child(3){border-top-color:var(--c-orange)} .kpis .kpi:nth-child(4){border-top-color:var(--c-green)}
.slot{border:2px solid var(--line);border-radius:12px;padding:10px;margin:10px 0}
.slot .lbl{font-weight:800;font-size:13px;letter-spacing:.5px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid3 input,.grid2 input{text-align:center}
.blk{border-left:4px solid var(--ink);padding-left:10px;margin:12px 0 4px}
.blk.int{border-left-style:dashed}
.live{text-align:center}
/* ---- V14 · capa visual sport-tech sobria (claro y oscuro) ---- */
:root{--shadow:0 4px 16px rgba(15,25,40,.08);--radius:16px}
@media (prefers-color-scheme: dark){:root{--shadow:0 10px 28px rgba(0,0,0,.30)}}
.card{border-radius:var(--radius);box-shadow:var(--shadow)}
.card h2{letter-spacing:.01em}
button{transition:transform .12s ease,background-color .12s ease}
button:active{transform:scale(.97)}
:focus-visible{outline:3px solid var(--c-orange)!important;outline-offset:2px}
.kpi b,.lv-top b,.clock{font-variant-numeric:tabular-nums}
.kpi{border-radius:12px}
.slot{border-radius:14px}
.tag.down{border-width:2px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
/* ---- sesión en vivo: pantalla fija, sin scroll ---- */
body.livemode{overflow:hidden;padding-bottom:0;min-height:0;height:100dvh}
body.livemode nav{display:none}
body.livemode main{padding:8px 12px 0;max-width:680px}
.lvw{height:calc(100dvh - 74px);display:flex;flex-direction:column;justify-content:space-between;gap:6px;overflow:hidden}
.lv-top{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;text-align:center}
.lv-top div{border:1px solid var(--line);border-radius:10px;padding:4px 2px;background:var(--card)}
.lv-top div:nth-child(1){border-top:4px solid var(--c-orange)} .lv-top div:nth-child(2){border-top:4px solid var(--c-sky)}
.lv-top div:nth-child(3){border-top:4px solid var(--c-purple)} .lv-top div:nth-child(4){border-top:4px solid var(--c-green)}
.lv-top b{display:block;font-size:19px;font-variant-numeric:tabular-nums} .lv-top span{font-size:11px;color:var(--mute)}
.lv-ring{position:relative;width:min(82vw,var(--rs,40dvh));aspect-ratio:1;margin:0 auto;flex-shrink:0}
.lv-ring svg{width:100%;height:100%;display:block}
.lv-ring .rn{font-size:12px;font-weight:800;fill:#111;paint-order:stroke;stroke:#fff;stroke-width:3px}
.lv-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.lv-c b{font-size:clamp(40px,11dvh,72px);line-height:1;font-variant-numeric:tabular-nums}
.lv-c span{font-size:13px;color:var(--mute);font-weight:700}
.lv-c .ph{font-size:14px;font-weight:900;letter-spacing:1px;border:2px solid var(--ink);border-radius:8px;padding:1px 8px;color:var(--ink)}
.lv-c .ph.work{background:var(--c-orange);color:#111;border-color:#111} .lv-c .ph.rest{border-style:dashed} .lv-c .ph.warm{border-style:dotted}
.lv-ex{text-align:center;min-height:0}
.lv-ex .pre{font-size:12px;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:1px}
.lv-ex .nm{font-size:22px;font-weight:800;line-height:1.15}
.lv-ex .tg2{font-size:14px;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lv-fix{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px;font-size:14px}
.lv-fix button{min-height:36px;width:44px;padding:0;font-size:20px}
.lv-list{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:3px 8px;flex:0 0 auto;overflow:hidden;align-content:start}
.lv-list li{display:flex;align-items:center;gap:5px;font-size:12.5px;min-width:0;border:1px solid var(--line);border-radius:8px;padding:2px 5px}
.lv-list li.now{border:2px solid var(--ink);font-weight:800}
.lv-list li.ok .nm{text-decoration:line-through;opacity:.7}
.lv-list .sw{min-width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#111;border:1px solid #111}
.lv-list .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv-list .ct{font-variant-numeric:tabular-nums;white-space:nowrap}
.lv-btn{display:grid;grid-template-columns:56px 2fr 1fr;gap:8px;padding-bottom:max(8px,env(safe-area-inset-bottom))}
.lv-btn button{min-height:56px;font-size:19px}
.phase{display:inline-block;font-weight:800;font-size:14px;letter-spacing:1px;border:2px solid var(--ink);border-radius:8px;padding:2px 10px}
.phase.rest{border-style:dashed}
.clock{font-size:80px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.05;margin:8px 0 2px}
.exname{font-size:23px;font-weight:800;margin:6px 0 2px}
.target{font-size:18px;margin:2px 0}
.bar{height:12px;border:2px solid var(--ink);border-radius:8px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:var(--acc)}
.rir{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rir button{min-height:52px;font-size:20px}
.rir button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);text-decoration:underline}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{min-width:56px;font-size:24px}
.stepper input{text-align:center;font-size:26px;font-weight:800}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.dots span{font-size:13px;border:2px solid var(--ink);border-radius:6px;padding:1px 7px;font-weight:700}
.dots span.todo{border-style:dotted;opacity:.6}
.dots span.now{outline:3px solid var(--acc);outline-offset:1px}
.hint{background:var(--ok-bg);border-radius:10px;padding:8px 10px;font-size:14px;text-align:left;margin:8px 0}
.warn{background:var(--warn-bg);color:var(--ink);border-left:5px solid var(--warn);border-radius:8px;padding:8px 10px;font-size:14px;margin:8px 0;text-align:left}
.okbox{background:var(--ok-bg);border-left:5px solid var(--acc);border-radius:8px;padding:8px 10px;font-size:14px;margin:8px 0}
.tag{font-size:12px;font-weight:800;border:2px solid currentColor;border-radius:6px;padding:0 6px;white-space:nowrap;display:inline-block;margin-top:3px}
.tag.up::before{content:"▲ "} .tag.down::before{content:"▼ "} .tag.keep::before{content:"■ "}
.tag.down{border-style:dashed}
.list li{list-style:none;padding:8px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;z-index:9;display:none;max-width:90vw}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:8px}
.kpi b{font-size:22px;display:block}
.next{font-size:15px;margin-top:4px}
.sticky{position:sticky;bottom:calc(70px + env(safe-area-inset-bottom));z-index:4;background:var(--bg);padding:8px 0}
.sticky button:not(.pri){background:var(--card)}
.exsel{font-weight:700}
/* ---- calendario · texto en cada día, nunca solo color ---- */
.calnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.calnav b{font-size:17px;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .hd{font-size:12px;font-weight:800;text-align:center;color:var(--mute)}
.cal button{min-height:58px;padding:3px 2px;border:1px solid var(--line);border-radius:8px;font-weight:400;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:1px;background:var(--card)}
.cal button .d{font-size:13px;font-weight:800}
.cal button .t{font-size:10px;font-weight:800;line-height:1.15;letter-spacing:.2px;margin-top:1px}
.cal button.act{background:var(--ok-bg);border:2px solid var(--ink)}
.cal button.hoy{outline:2px dashed var(--ink);outline-offset:1px}
.cal button.sel{outline:3px solid var(--c-orange);outline-offset:1px}
.cal button.out{visibility:hidden}
/* ---- mapa del cuerpo ---- */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.seg button{min-height:40px;font-size:14px;padding:4px}
.seg button[aria-pressed="true"]{background:var(--c-orange);border-color:var(--c-ink);color:#111;text-decoration:underline}
.body svg{width:100%;height:auto;display:block}
.body .n{fill:var(--line)}
.body .z{stroke:var(--ink);stroke-width:1.2}
.body .z0{fill:var(--card)}
.body{--hz:var(--c-blue)}
.body .sil{fill:color-mix(in srgb,var(--ink) 10%,var(--bg));stroke:var(--mute);stroke-width:1}
.body .nz{fill:color-mix(in srgb,var(--ink) 16%,var(--bg));stroke:var(--bg);stroke-width:1.2}
.body .z{stroke:var(--bg);stroke-width:1.4;stroke-linejoin:round}
.body text{font-size:11px;fill:var(--mute);font-weight:800;letter-spacing:1px}
/* niveles: Día = de claro a azul intenso */
.z0,.l0{--f:color-mix(in srgb,var(--ink) 22%,var(--bg))}
.l1{--f:color-mix(in srgb,var(--c-sky) 45%,var(--bg))} .l2{--f:var(--c-sky)} .l3{--f:var(--c-blue)} .l4{--f:url(#hatch)}
.body .z0{fill:color-mix(in srgb,var(--ink) 22%,var(--bg))}
.body .z1{fill:color-mix(in srgb,var(--c-sky) 45%,var(--bg))} .body .z2{fill:var(--c-sky)} .body .z3{fill:var(--c-blue)} .body .z4{fill:url(#hatch);stroke:var(--ink);stroke-width:2}
/* Semana: BAJO amarillo · OK verde · ALTO bermellón rayado */
.body.m-sem{--hz:var(--c-verm)} .body.m-sem .z1{fill:var(--c-yellow)} .body.m-sem .z3{fill:var(--c-green)}
/* ¿Listo hoy?: LISTO verde · CARGADO naranja · FATIGADO bermellón rayado */
.body.m-rec{--hz:var(--c-verm)} .body.m-rec .z0{fill:var(--c-green)} .body.m-rec .z2{fill:var(--c-orange)}
.zkey{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;margin:6px 0}
.zkey span{display:inline-flex;align-items:center;gap:5px}
.zkey i,.zl i.sw{width:18px;height:14px;border-radius:4px;border:1.5px solid var(--ink);display:inline-block;flex-shrink:0}
.zkey .l0,.zl .sw.l0{background:color-mix(in srgb,var(--ink) 22%,var(--bg))}
.zkey .l1,.zl .sw.l1{background:color-mix(in srgb,var(--c-sky) 45%,var(--bg))} .zkey .l2,.zl .sw.l2{background:var(--c-sky)} .zkey .l3,.zl .sw.l3{background:var(--c-blue)}
.zkey .l4,.zl .sw.l4{background:repeating-linear-gradient(45deg,var(--c-blue) 0 4px,#111 4px 6px);border-width:2px}
.m-sem .l1,.zl.m-sem .sw.l1{background:var(--c-yellow)} .m-sem .l3,.zl.m-sem .sw.l3{background:var(--c-green)}
.m-sem .l4,.zl.m-sem .sw.l4{background:repeating-linear-gradient(45deg,var(--c-verm) 0 4px,#111 4px 6px)}
.m-rec .l0,.zl.m-rec .sw.l0{background:var(--c-green)} .m-rec .l2,.zl.m-rec .sw.l2{background:var(--c-orange)}
.m-rec .l4,.zl.m-rec .sw.l4{background:repeating-linear-gradient(45deg,var(--c-verm) 0 4px,#111 4px 6px)}
.zl{display:grid;grid-template-columns:auto auto 1fr;gap:6px 8px;align-items:center;font-size:14px;margin-top:6px}
.zl .r{text-align:right}
.reg li{display:flex;gap:8px;align-items:center}
.fz{display:grid;grid-template-columns:4.4em 1fr auto;gap:8px;align-items:center;font-size:14px;padding:5px 0;border-top:1px solid var(--line)}
.fz .b{height:14px;border:2px solid var(--ink);border-radius:6px;overflow:hidden;display:block}
.fz .b i{display:block;height:100%}
.fz .st{font-weight:700;font-size:13px;text-align:right;white-space:nowrap}
.fz .b i.tg{display:block;border:0;padding:0;border-radius:0;height:100%}
.reg .grow{min-width:0}
details.add>summary{font-weight:800;cursor:pointer;padding:6px 0;list-style:none}
details.add>summary::before{content:"＋ "}
details.add[open]>summary::before{content:"− "}
</style>
</head>
<body>
<header>
  <h1>Full Body JJB</h1>
  <span id="weekChip" class="chip">Sem –</span>
</header>
<main id="app"></main>
<nav>
  <button data-tab="hoy" aria-current="true"><span class="ic">▶</span>Hoy</button>
  <button data-tab="lib"><span class="ic">☰</span>Biblioteca</button>
  <button data-tab="hist"><span class="ic">▦</span>Historial</button>
  <button data-tab="datos"><span class="ic">⇅</span>Datos</button>
</nav>
<div id="toast" class="toast"></div>

<script src="lib.js"></script>
<script>
"use strict";
/* =====================================================================
   PLANIFICADOR FULL BODY · el usuario elige; la app prescribe, cronometra y registra
   ===================================================================== */
const TRANS = 60, SIDE = 15, PAIR_REST = 30;
const OBJ = {F:"Fuerza", H:"Hipertrofia", Q:"Quema (circuito)"};
const FMT = {series:"Series", super:"Superseries (pares)", circuito:"Circuito por intervalos"};
// Huecos de una sesión full body: orden pensado para superseries (rodilla+tirón, cadera+empuje...)
const SLOT_DEF = [
  {z:"rod", lbl:"Pierna · cuádriceps"}, {z:"tiV", lbl:"Tirón vertical"},
  {z:"cad", lbl:"Glúteo e isquios"},    {z:"peH", lbl:"Empuje horizontal"},
  {z:"tiH", lbl:"Tirón horizontal"},    {z:"peV", lbl:"Empuje vertical"},
  {z:"core",lbl:"Core"},                 {z:"met", lbl:"Finisher"}
];
const FULLBODY = [["rod","cad"],["peH","peV"],["tiV","tiH"],["core"]];
const FB_NAMES = ["pierna","empuje","tirón","core"];
const VOL_TARGET = {rod:[8,14], cad:[8,14], peH:[6,12], peV:[6,10], tiV:[6,12], tiH:[6,12], core:[6,12]};
const MODS = [
  {id:"sueno", label:"Dormí menos de 6 h", fx:"−1 serie en todo, RIR 3"},
  {id:"padel", label:"Pádel intenso ayer", fx:"Fuera cuádriceps y saltos"},
  {id:"mar",   label:"Surf o kite de más de 2 h", fx:"Fuera glúteo/isquio pesado y tirón vertical a la mitad"},
  {id:"dolor", label:"Molestia articular > 3/10", fx:"Usa la regresión o cambia el ejercicio"},
  {id:"t20",   label:"Solo tengo 20 minutos", fx:"Los 3 primeros ejercicios, 2 series"}

function blank(){ return {start:null, sessions:[], acts:[], weights:[], tpls:[], live:null, draft:null, settings:{sound:true, vib:true}}; }
function migrateActs(list){ (list||[]).forEach(a=>{ if(a.type==="Running") a.type="Carrera"; else if(a.type==="Zona 2"){ a.type="Elíptica"; a.modo=a.modo||"continuo"; } else if(a.type==="Intervalos"){ a.type="Elíptica"; a.modo="intervalos"; } }); return list; }
function cleanData(d){ // descarta registros rotos en vez de romper la app
  const ok=x=>x && typeof x==="object";
  d.sessions=(Array.isArray(d.sessions)?d.sessions:[]).filter(x=>ok(x) && typeof x.date==="string" && Array.isArray(x.ex)).map(x=>(x.ex=x.ex.filter(e=>ok(e)&&Array.isArray(e.sets)), x));
  d.acts=migrateActs((Array.isArray(d.acts)?d.acts:[]).filter(x=>ok(x) && typeof x.date==="string" && x.type));
  d.weights=(Array.isArray(d.weights)?d.weights:[]).filter(x=>ok(x) && typeof x.date==="string");
  d.tpls=(Array.isArray(d.tpls)?d.tpls:[]).filter(x=>ok(x) && Array.isArray(x.slots));
  return d;
}

function load(){
  const raw = localStorage.getItem(KEY);
  try{ const d = JSON.parse(raw); if(d && d.sessions){ const o=cleanData(Object.assign(blank(), d)); if(o.live && o.live.v!==3) o.live=null;
    return o; } }catch(e){}
  // datos ilegibles: se guardan aparte antes de empezar en blanco, para no perderlos nunca
  if(raw){ try{ localStorage.setItem(KEY+"_corrupto_"+Date.now(), raw); }catch(e){} LOAD_WARN="Los datos guardados no se podían leer. Se ha guardado una copia aparte y la app empieza en blanco."; }

}

/* ============ HELPERS ============ */
function isoDate(d){ const z=new Date(d.getTime()-d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); }
function mondayOf(d){ const x=new Date(d); x.setDate(x.getDate()-((x.getDay()+6)%7)); return isoDate(x); }
function fmt(s){ s=Math.max(0,Math.round(s)); const m=Math.floor(s/60), r=s%60; return m+":"+String(r).padStart(2,"0"); }
function mins(s){ return Math.round(s/60)+"'"; }
function esc(t){ return String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function $(s){ return document.querySelector(s); }
function weekInfo(date=new Date()){
  const days = Math.floor((new Date(isoDate(date)) - new Date(DB.start))/86400000);
  const w = Math.max(0,days);
  return {week:(Math.floor(w/7)%4)+1, cycle:Math.floor(w/28)+1};
}
function rirTarget(week, mods){ if(mods && mods.includes("sueno")) return "3"; return week===1?"3":week===4?"3 (descarga)":"1–2"; }
function unitTxt(e){ return e.iso ? " s" : " reps"; }
function repTxt(e){ if(e.iv) return ivTxt(e.iv); return (e.lo===e.hi?e.lo:e.lo+"–"+e.hi)+unitTxt(e)+(e.u?" por lado":""); }
function ivTxt(iv){ return iv[0]>=120 ? Math.round(iv[0]/60)+"'" : iv[0]+"\" / "+iv[1]+"\" × "+iv[2]; }
function eqTxt(e){ return e.eq.split("").map(c=>EQ[c]).join(" + "); }
function lvlTxt(n){ return ["","Básico","Medio","Avanzado"][n]; }
function sessionName(s){ return s.name || ({A:"FB-A",B:"FB-B",C:"FB-C"})[s.key] || "Sesión"; }

/* ============ USO RECIENTE Y VOLUMEN ============ */
function lastUsed(){ // id → fecha más reciente
  const m={}; DB.sessions.forEach(s=>s.ex.forEach(x=>{ if(!m[x.id] || s.date>m[x.id]) m[x.id]=s.date; })); return m;
}
function daysAgo(date){ return Math.round((new Date(isoDate(new Date())) - new Date(date))/864e5); }
function weekVolume(){ // series hechas por zona esta semana
  const m=mondayOf(new Date()), v={};
  DB.sessions.filter(s=>s.date>=m).forEach(s=>Object.entries(sessZones(s)).forEach(([z,n])=>v[z]=(v[z]||0)+n));
  Object.keys(v).forEach(z=>v[z]=Math.round(v[z])); return v;
}

const SPLIT = {met:{rod:.4, cad:.3, peV:.15, core:.15}, ani:{core:.4, peV:.3, peH:.15, rod:.15}};
function sessZones(s){ const per={}; s.ex.forEach(x=>{ const z=(LIB_BY[x.id]||{}).z||x.zone, n=x.sets.length; if(!z) return;
  if(SPLIT[z]) Object.entries(SPLIT[z]).forEach(([k,f])=>per[k]=(per[k]||0)+n*f); else per[z]=(per[z]||0)+n; }); return per; }
function actZones(a){ const L=ACT_LOAD[a.type]||{}, k=(+a.min||0)/60*(INT_F[a.int]||1), o={}; Object.entries(L).forEach(([z,n])=>o[z]=n*k); return o; }
function zoneSets(from, to){ // series por zona entre dos fechas (incluidas); deporte en series equivalentes
  const v={}, add=o=>Object.entries(o).forEach(([z,n])=>v[z]=(v[z]||0)+n);
  DB.sessions.filter(s=>s.date>=from && s.date<=to).forEach(s=>add(sessZones(s)));
  DB.acts.filter(a=>a.date>=from && a.date<=to).forEach(a=>add(actZones(a)));
  return v;
}
function fatigueMap(now=Date.now()){
  const f={}, add=(z,sets,t)=>{ if(!FZ_HL[z]||t>now) return; const h=(now-t)/36e5; if(h>24*30) return; f[z]=(f[z]||0)+(sets/8)*Math.pow(.5,h/FZ_HL[z]); };
  DB.sessions.forEach(s=>Object.entries(sessZones(s)).forEach(([z,n])=>add(z, Math.min(12,n), s.end||new Date(s.date+"T19:00").getTime())));
  DB.acts.forEach(a=>Object.entries(actZones(a)).forEach(([z,n])=>add(z, Math.min(12,n), new Date(a.date+"T13:00").getTime())));
  return f;
}

function mapData(mode){
  const out={};
  if(mode==="dia"){ const k=HIST.sel||isoDate(new Date()), v=zoneSets(k,k);
    FZ_SHOW.forEach(z=>{ const n=v[z]||0, r=Math.round(n), l=!n?0:n<4?1:n<7?2:n<10?3:4;
      out[z]={l, st:MODES.dia.key.find(x=>x[0]==="l"+l)[1], txt:n?r+" series"+(n%1?" (con deporte)":""):"—"}; });
  } else if(mode==="sem"){ const v=zoneSets(isoDate(new Date(Date.now()-6*864e5)), isoDate(new Date()));
    FZ_SHOW.forEach(z=>{ const n=Math.round(v[z]||0), t=VOL_TARGET[z];
      if(!t){ out[z]={l:n?3:0, st:n?"HECHO":"SIN TRABAJO", txt:n+" series · sin objetivo"}; return; }
      const l=!n?0:n<t[0]?1:n>t[1]?4:3;
      out[z]={l, st:l===0?"SIN TRABAJO":l===1?"BAJO":l===3?"OK":"ALTO", txt:n+" de "+t[0]+"–"+t[1]+" series"}; });
  } else { const f=fatigueMap();
    FZ_SHOW.forEach(z=>{ const v=f[z]||0, h=readyIn(z,v), l=v<=.25?0:v<=.5?2:4;
      out[z]={l, st:l===0?"LISTO":l===2?"CARGADO":"FATIGADO", txt:l===0?"ya recuperado":readyTxt(h).replace("Listo","listo")}; });
  }
  return out;
}

function calendarHTML(){
  const today=isoDate(new Date()), ym=HIST.ym||today.slice(0,7), [Y,M]=ym.split("-").map(Number);
  const first=new Date(Y,M-1,1), lead=(first.getDay()+6)%7, nd=new Date(Y,M,0).getDate();
  let cells=["L","M","X","J","V","S","D"].map(x=>`<span class="hd">${x}</span>`).join("");
  for(let i=0;i<lead;i++) cells+=`<button class="out" tabindex="-1"></button>`;
  let days=0, fb=0, dep=0, min=0;
  for(let d=1; d<=nd; d++){
    const k=ym+"-"+String(d).padStart(2,"0"), e=entriesOn(k);
    if(e.length){ days++; fb+=e.filter(x=>x.k==="s").length; dep+=e.filter(x=>x.k==="a").length; min+=e.reduce((a,x)=>a+x.min,0); }
    const tags=e.slice(0,2).map(x=>`<span class="t tg ${x.abbr}">${x.abbr} ${x.min}'</span>`).join("")+(e.length>2?`<span class="t">+${e.length-2}</span>`:"");
    const cls=[e.length?"act":"", k===today?"hoy":"", k===HIST.sel?"sel":""].join(" ");
    cells+=`<button class="${cls}" data-day="${k}" aria-label="${longD(k)}${e.length?": "+e.map(x=>x.t+" "+x.min+" min").join(", "):""}"><span class="d">${d}</span>${tags}</button>`;
  }
  return `<div class="card"><div class="calnav"><button class="sm" id="calP" aria-label="Mes anterior">◀</button><b>${MESES[M-1]} ${Y}</b><button class="sm" id="calN" aria-label="Mes siguiente">▶</button></div>
    <div class="cal">${cells}</div>
    <div class="mute small" style="margin-top:8px"><b>${days}</b> días activos · <b>${fb}</b> rutinas · <b>${dep}</b> de deporte · <b>${Math.round(min/6)/10} h</b> en total</div>
    <div class="small" style="margin-top:4px;display:flex;flex-wrap:wrap;gap:4px">${["FB","ELÍP","RUN","PAS","PÁD","SURF","KITE","ESQ"].map(a=>`<span class="tg ${a}">${a}</span>`).join("")}<span class="mute">FB = rutina · ELÍP = elíptica · RUN = carrera · PAS = paseo · PÁD = pádel · ESQ = esquí</span></div></div>`;
}

const CARDIO = ["Elíptica","Carrera","Paseo"];
function paceTxt(min, km){ if(!min||!km) return ""; const p=min/km, m=Math.floor(p), s=Math.round((p-m)*60);
  return (s===60?(m+1)+":00":m+":"+String(s).padStart(2,"0"))+" /km · "+(km/(min/60)).toFixed(1).replace(".",",")+" km/h"; }
function cardioDet(a){
  const p=[];
  if(a.modo==="intervalos") p.push("intervalos");
  if(a.hr) p.push("FC media "+a.hr+(a.hrMax?" · máx "+a.hrMax:""));
  else if(a.hrMax) p.push("FC máx "+a.hrMax);
  if(a.km) p.push(String(a.km).replace(".",",")+" km");
  if(a.km && a.min && a.type!=="Elíptica") p.push(paceTxt(+a.min, +a.km));
  return p.join(" · ");
}

        return {id:"man_"+z, name:FZ_SHORT[z]+" (manual)", zone:z, mode:"manual", sets:Array.from({length:n},(_,i)=>({round:i+1, reps:0}))}; });
      const end=new Date(date+"T19:00").getTime();
      DB.sessions.push({id:uid(), v:3, manual:true, name:"Rutina", date, start:end-min*6e4, end, durSec:min*60, estSec:0,
        week:weekInfo(new Date(date+"T12:00")).week, mods:[], ex, notes:note, rpe:null});
    } else {

}

/* ============ COMPOSICIÓN CORPORAL (reloj Samsung, bioimpedancia) ============
   El reloj es ruidoso día a día: comparo medias ponderadas, no mediciones sueltas.
   Coeficiente de fiabilidad: 1 en ayunas por la mañana, 0,5 en otras condiciones. */
// Mismos datos y orden que el análisis corporal de Samsung Health
const BC = [
  {k:"kg",    n:"Peso",                  u:"kg",   noise:0.6, good:-1, ph:"100,0"},
  {k:"mus",   n:"Masa muscular",         u:"kg",   noise:0.8, good:1,  ph:"40,0"},
  {k:"fatKg", n:"Masa grasa",            u:"kg",   noise:1.2, good:-1, ph:"25,0"},
  {k:"wat",   n:"Agua corporal",         u:"kg",   noise:1.0, good:0,  ph:"52,0"},
  {k:"fat",   n:"Grasa corporal",        u:"%",    noise:1.5, good:-1, ph:"25,0"},
  {k:"imc",   n:"IMC",                   u:"",     noise:0.2, good:-1, ph:"28,3"},
  {k:"bmr",   n:"Índice metabólico basal",u:"kcal", noise:30,  good:0,  ph:"2143", int:true}];
const H_M = 1.88; // altura para calcular el IMC si no lo apuntas
function bcPoints(k){ return DB.weights.filter(w=>w[k]!=null && w[k]!=="" && !isNaN(+w[k])).map(w=>({d:w.date, v:+w[k], c:w.std===false?.5:1})).sort((a,b)=>a.d.localeCompare(b.d)); }
function bcAvg(pts, end, days=10){ const from=isoDate(new Date(new Date(end+"T12:00").getTime()-days*864e5));
  const w=pts.filter(p=>p.d>from && p.d<=end); const c=w.reduce((s,p)=>s+p.c,0); return c? {v:w.reduce((s,p)=>s+p.v*p.c,0)/c, n:w.length, c} : null; }
function nf(v,d=1){ return v.toFixed(d).replace(".",","); }
function bcFmt(m,v){ return m.int ? String(Math.round(v)) : nf(v); }
function bcStatus(m){
  const pts=bcPoints(m.k), today=isoDate(new Date()); if(!pts.length) return null;
  const cur=bcAvg(pts,today), prev=bcAvg(pts,isoDate(new Date(Date.now()-28*864e5)), 14), last=pts[pts.length-1];
  let verdict="Necesito 4 semanas de datos para ver la tendencia", cls="keep";
  if(cur && prev){ const d=cur.v-prev.v, real=Math.abs(d)>=m.noise;
    if(!real){ verdict=`Estable: ${d>=0?"+":""}${bcFmt(m,d)} ${m.u} en 4 sem, dentro del margen del reloj (±${bcFmt(m,m.noise)})`; cls="keep"; }
    else { const up=d>0; verdict=`${up?"SUBE":"BAJA"} de verdad: ${up?"+":""}${bcFmt(m,d)} ${m.u} en 4 sem${m.good?((up?1:-1)===m.good?" · bien":" · vigilar"):""}`; cls=up?"up":"down"; } }
  return {pts, cur, last, verdict, cls};
}
function sparkSVG(pts, m){
  const from=isoDate(new Date(Date.now()-60*864e5)), P=pts.filter(p=>p.d>=from); if(P.length<2) return "";
  const vs=P.map(p=>p.v), lo=Math.min(...vs), hi=Math.max(...vs), span=Math.max(hi-lo, m.noise), W=300, H=56;
  const t0=new Date(from+"T12:00").getTime(), x=d=>8+(new Date(d+"T12:00").getTime()-t0)/(60*864e5)*(W-16), y=v=>H-8-(v-lo)/span*(H-16);
  const avg=P.map(p=>{ const a=bcAvg(pts,p.d); return `${x(p.d).toFixed(1)},${y(a.v).toFixed(1)}`; }).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;margin:4px 0" role="img" aria-label="Evolución de ${m.n}">
    <polyline points="${avg}" fill="none" stroke="var(--c-blue)" stroke-width="3" stroke-linejoin="round"/>
    ${P.map(p=>`<circle cx="${x(p.d).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3" ${p.c<1?'fill="var(--card)" stroke="var(--ink)" stroke-width="1.5"':'fill="var(--ink)"'}/>`).join("")}
    <text x="${W-4}" y="10" text-anchor="end" style="font-size:10px;fill:var(--mute)">${bcFmt(m,hi)}</text><text x="${W-4}" y="${H-1}" text-anchor="end" style="font-size:10px;fill:var(--mute)">${bcFmt(m,lo)}</text></svg>`;
}
function bodyCompHTML(){
  const rows=BC.map(m=>{ const s=bcStatus(m); if(!s) return "";
    return `<div style="padding:8px 0;border-top:1px solid var(--line)"><div class="row"><b class="grow">${m.n}</b><span class="num"><b>${bcFmt(m,s.last.v)} ${m.u}</b> <span class="mute small">último · media ${s.cur?bcFmt(m,s.cur.v):"–"}</span></span></div>

  const b=$("#bSave"); if(!b) return;

/* ============ PRESCRIPCIÓN (criterio de entrenador) ============ */
function presc(L, obj){
  if(L.iv) return {sets:1, lo:0, hi:0, rest:0};
  const light = ["core","ani","mov","gem"].includes(L.z);
  let sets=3, lo=L.lo, hi=L.hi, rest;
  if(obj==="F"){ if(L.c){ sets=3; hi=Math.max(lo, Math.round((lo+hi)/2)); rest=90; } else { sets=2; rest = light?45:75; } }
  else if(obj==="H"){ sets = L.c?3:2; rest = L.c?90:(light?45:60); }  // full body diario: volumen repartido
  else { rest=20; }
  if(L.z==="mov"){ sets=2; rest=20; }
  return {sets, lo, hi, rest};
}

/* ============ PLANIFICADOR: borrador ============ */
function newDraft(){
  return {id:uid(), name:"Full body "+new Date().toLocaleDateString("es-ES",{weekday:"long", day:"numeric"}),
    obj:"H", fmt:"super", rounds:3, warm:5, lvl:3, eq:{M:1,B:1,D:1,C:1},
    slots:SLOT_DEF.map(s=>({z:s.z, lbl:s.lbl, ex:"", sets:3, lo:0, hi:0, rest:60}))};
}
function draft(){ if(!DB.draft) { DB.draft = newDraft(); save(); } return DB.draft; }
function candidates(d, z){
  return LIB.filter(e=>(z==="all" ? e.z!=="car" : e.z===z) && e.lvl<=d.lvl && e.eq.split("").every(c=>d.eq[c] || c==="K" || c==="E"));
}
function setSlotEx(d, s, id){
  s.ex = id;
  if(id){ const p = presc(LIB_BY[id], d.obj); Object.assign(s, p); }
}
function autoPick(d, s, idx){
  const used = lastUsed(), taken = new Set(d.slots.filter(x=>x!==s).map(x=>x.ex)), st=zoneState(s.z, fatigueMap()), tired=st.st==="FATIGADO";
  let c = candidates(d, s.z).filter(e=>!taken.has(e.id));
  if(!c.length) return;
  const score = e => {
    const da = used[e.id] ? daysAgo(used[e.id]) : 99;
    let sc = Math.min(da, 14)*10;                       // prioriza no repetir en 7–14 días
    if(tired && e.c) sc -= 40;                          // zona fatigada: mejor accesorio que compuesto pesado
    if(tired && e.lvl===3) sc -= 30;
    if(da < 7) sc -= 200;                               // repetido esta semana: penaliza fuerte
    if(idx<4 && e.c) sc += d.obj==="Q"?0:40;            // los primeros huecos, compuestos
    if(d.obj==="Q" && (e.z==="met" || e.j)) sc += 20;
    if(idx<4 && e.lvl===1 && d.lvl>1) sc -= 15;           // en los principales, mejor variantes con más carga
    if(idx<4 && e.lvl===2) sc += 10;
    return sc + Math.random()*25;
  };
  c.sort((a,b)=>score(b)-score(a));
  setSlotEx(d, s, c[0].id);
  if(tired && s.sets>1) s.sets--;                      // y una serie menos
}
function zoneState(z, f){ const zs = SPLIT[z] ? Object.keys(SPLIT[z]) : [z]; const v=Math.max(0,...zs.map(k=>f[k]||0)), k=zs.find(k=>(f[k]||0)===v)||z;
  return v>.5?{st:"FATIGADO", h:readyIn(k,v)}:v>.25?{st:"CARGADO", h:readyIn(k,v)}:{st:"LISTO", h:0}; }
function balanceWarnings(d){
  const zs = d.slots.filter(s=>s.ex && LIB_BY[s.ex]).map(s=>LIB_BY[s.ex].z), cnt=z=>zs.filter(x=>x===z).length, w=[];
  ["rod","cad","peH","peV","tiV","tiH"].forEach(z=>{ if(cnt(z)>1) w.push(`${cnt(z)} ejercicios de ${ZONES[z].toLowerCase()}: cambia uno por otro patrón`); });
  if(d.eq.D && !cnt("tiV")) w.push("Sin tirón vertical teniendo barra: añade dominadas o jalón con banda");
  const push=cnt("peH")+cnt("peV"), pull=cnt("tiV")+cnt("tiH"); if(push-pull>=2) w.push(`Más empuje (${push}) que tirón (${pull}): equilibra con un remo o dominada`);
  if(Math.abs(cnt("rod")-cnt("cad"))>=2) w.push("Pierna descompensada entre rodilla (cuádriceps) y cadera (glúteo/isquio)");
  return w;
}
function fullBodyCheck(d){
  const zs = d.slots.filter(s=>s.ex).map(s=>LIB_BY[s.ex].z);
  const miss = FULLBODY.map((g,i)=>g.some(z=>zs.includes(z))?null:FB_NAMES[i]).filter(Boolean);
  return miss;
}

/* ============ CONSTRUCCIÓN DE LA SESIÓN ============ */
function tplItems(t){ return t.slots.filter(s=>s.ex && LIB_BY[s.ex]).map(s=>Object.assign({}, LIB_BY[s.ex], {sets:+s.sets||1, lo:+s.lo||0, hi:+s.hi||0, rest:+s.rest||0})); }
function buildPlan(t, mods){
  const wk = weekInfo().week, W = WEEK[wk], notes = [];
  let items = tplItems(t), rounds = +t.rounds || 3, warm = (+t.warm||5)*60;
  const isCirc = t.fmt==="circuito";
  // semana
  if(wk===3 && !isCirc) items.slice(0,2).forEach(e=>{ if(!e.iv) e.sets++; });
  if(wk===4){ items.forEach(e=>{ if(!e.iv) e.sets=Math.max(1,e.sets-1); }); rounds=Math.min(rounds,2); notes.push("Semana 4: descarga"); }
  if(wk===2) notes.push("Semana 2: busca +1–2 reps respecto a la semana pasada");
  // reglas del día
  if(mods.includes("sueno")){ items.forEach(e=>{ if(!e.iv) e.sets=Math.max(1,e.sets-1); }); rounds=Math.max(1,rounds-1); notes.push("Mal sueño: −1 serie, RIR 3"); }
  if(mods.includes("padel")){ const out=items.filter(e=>e.z==="rod"||e.j); if(out.length) notes.push("Fuera por el pádel: "+out.map(e=>e.n).join(" · ")); items=items.filter(e=>!(e.z==="rod"||e.j)); }
  if(mods.includes("mar")){ const out=items.filter(e=>e.z==="cad"&&e.c); if(out.length) notes.push("Fuera por el mar: "+out.map(e=>e.n).join(" · ")); items=items.filter(e=>!(e.z==="cad"&&e.c)); items.forEach(e=>{ if(e.z==="tiV") e.sets=Math.max(1,Math.ceil(e.sets/2)); }); }
  if(mods.includes("t20")){ items=items.filter(e=>!e.iv).slice(0,3); items.forEach(e=>e.sets=Math.min(2,e.sets)); rounds=2; warm=180; notes.push("20': 3 ejercicios × 2"); }
  if(mods.includes("dolor")) notes.push("Molestia: usa la regresión o cambia ese ejercicio");
  const cardio = items.filter(e=>e.iv), main = items.filter(e=>!e.iv);
  const blocks = [];
  if(isCirc){ if(main.length) blocks.push({t:"int", name:"Circuito", rounds, rr:60, work:W.w, rest:W.r, ex:main}); }
  else if(t.fmt==="super"){ for(let i=0;i<main.length;i+=2){ const pair=main.slice(i,i+2); blocks.push({t:"sup", name:pair.length>1?"Superserie "+(i/2+1):pair[0].n, ex:pair, rest:Math.max(...pair.map(e=>e.rest))}); } }
  else main.forEach(e=>blocks.push({t:"sup", name:e.n, ex:[e], rest:e.rest}));
  cardio.forEach(e=>blocks.push({t:"int", name:e.n, rounds:e.iv[2], rr:0, work:e.iv[0], rest:e.iv[1], ex:[e]}));
  const steps = [];
  blocks.forEach((b,bi)=>{
    const lastBlock = bi===blocks.length-1;
    if(b.t==="sup"){
      const maxS = Math.max(...b.ex.map(e=>e.sets));
      for(let r=0;r<maxS;r++){
        const act = b.ex.filter(e=>r<e.sets);
        act.forEach((e,i)=>{
          const last = i===act.length-1;
          let rest = last ? b.rest : PAIR_REST;
          if(last && r===maxS-1) rest = lastBlock ? 0 : TRANS;
          steps.push({bi, bname:b.name, kind:"reps", e, r, rounds:e.sets, rest});
        });
      }
    } else {
      for(let r=0;r<b.rounds;r++) b.ex.forEach((e,ei)=>{
        const lastEx = ei===b.ex.length-1, lastR = r===b.rounds-1;
        const s = {bi, bname:b.name, kind:"time", e, r, rounds:b.rounds, work:b.work, rest:b.rest + (lastEx && !lastR ? b.rr : 0)};
        if(lastEx && lastR) s.rest = lastBlock ? 0 : TRANS;
        steps.push(s);
      });
    }
  });
  return {tplId:t.id, name:t.name, obj:t.obj, fmt:t.fmt, blocks, steps, warm, notes, mods, week:wk, rir:rirTarget(wk,mods), warmTxt:warmText(t)};
}
function warmText(t){
  const zs = new Set(tplItems(t).map(e=>e.z));
  const list = ["Gato-camello 8", "World's greatest stretch 4/lado", "Secuencia primal ×3"];
  if(zs.has("tiV")||zs.has("peV")) list.push("Dislocaciones con banda 10 · dominada escapular 8");
  if(zs.has("rod")||zs.has("cad")) list.push("Movilidad de tobillo 10/lado · sentadilla profunda 30 s");
  if(zs.has("peH")) list.push("Movilidad de muñecas 30 s");
  return list.join(" · ");
}
function stepWork(s){ if(s.kind==="time") return s.work; const e=s.e; return (e.iso ? e.hi : e.hi*e.tp)*(e.u?2:1)+(e.u?SIDE:0); }
function estimate(plan){ return plan.warm + plan.steps.reduce((a,s)=>a+stepWork(s)+s.rest, 0); }

/* ============ HISTORIAL Y PROGRESIÓN ============ */
function logsFor(exId){
  const out=[]; DB.sessions.slice().sort((a,b)=>b.end-a.end).forEach(s=>{ const x=s.ex.find(e=>e.id===exId); if(x && x.sets.length) out.push({date:s.date, sets:x.sets, mode:x.mode, lo:x.lo, hi:x.hi}); });
  return out;
}
function lastHint(e){
  const l = logsFor(e.id)[0]; if(!l) return "Primera vez: anota reps y peso o variante.";
  const v = l.sets[l.sets.length-1].var;
  return "Última vez ("+l.date.slice(5)+"): "+l.sets.map(s=>s.reps).join(" · ")+(e.iso?" s":"")+(l.sets[0].rir!=null?" · RIR mín "+Math.min(...l.sets.map(s=>s.rir??3)):"")+(v?" · "+v:"");
}
function nextVariant(e){ // siguiente paso con el material de casa (sin más kilos)
  const own = c=>"MBDC".includes(c);
  const c = LIB.filter(x=>x.z===e.z && x.id!==e.id && !x.iv && x.eq.split("").every(own) && (x.lvl>e.lvl || (x.lvl===e.lvl && (x.tp>e.tp || (x.u && !e.u)))))
    .sort((a,b)=>a.lvl-b.lvl || (b.u-a.u) || (b.tp-a.tp));
  return c[0] || null;
}
function progress(id){
  const all = logsFor(id), e = LIB_BY[id];
  if(!e || !all.length) return {k:"keep", t:"Sin datos"};
  const L = all.filter(l=>l.sets.some(z=>!z.auto));   // solo cuenta lo que has confirmado
  if(!L.length) return {k:"keep", t:"SIN CONFIRMAR: revisa las reps en el resumen de la sesión"};
  const l = L[0];
  if(l.mode==="time"){
    if(l.sets.length<2) return {k:"keep", t:"MANTÉN"};
    const f=l.sets[0].reps, z=l.sets[l.sets.length-1].reps;
    if(z>=f) return {k:"up", t:"SUBE: más peso o variante más difícil"};
    if(z<0.7*f) return {k:"down", t:"BAJA: variante más fácil"};
    return {k:"keep", t:"MANTÉN: +1 rep por intervalo"};
  }
  const hi = l.hi || e.hi, lo = l.lo || e.lo;
  const top = l.sets.every(s=>s.reps>=hi) && Math.min(...l.sets.map(s=>s.rir??0))>=2;
  const low = l.sets.filter(s=>s.reps<lo).length >= Math.ceil(l.sets.length/2);
  if(top){ const nv=nextVariant(e);
    return {k:"up", t:"SUBE: "+(e.tp<6?"baja en 3 s con pausa de 1 s abajo; si ya lo haces, ":"")+(nv?"pasa a «"+nv.n+"»":"añade banda o haz 1½ reps")}; }
  if(low) return {k:"down", t:"BAJA: variante más fácil"};
  return {k:"keep", t:"MANTÉN: busca +1 rep"};
}

/* ============ AUDIO / VIBRACIÓN / PANTALLA ============ */
let actx=null, wakeLock=null;
function beep(freq=880, dur=.15){
  if(!DB.settings.sound) return;
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=freq; o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(.25, actx.currentTime); g.gain.exponentialRampToValueAtTime(.001, actx.currentTime+dur);
    o.start(); o.stop(actx.currentTime+dur); }catch(e){}
}
function buzz(p){ if(DB.settings.vib && navigator.vibrate) try{ navigator.vibrate(p); }catch(e){} }
async function keepAwake(on){
  try{ if(on && "wakeLock" in navigator && !wakeLock){ wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release",()=>wakeLock=null); }
       if(!on && wakeLock){ await wakeLock.release(); wakeLock=null; } }catch(e){}
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && DB.live) keepAwake(true); });
function toast(t){ const el=$("#toast"); el.textContent=t; el.style.display="block"; clearTimeout(toast.h); toast.h=setTimeout(()=>el.style.display="none",2400); }

  MODS.forEach(m=>{ h+=`<label class="check"><input type="checkbox" data-m="${m.id}" ${sel.includes(m.id)?"checked":""}><span><b>${m.label}</b><br><span class="mute">→ ${m.fx}</span></span></label>`; });
  h += `</div><div class="card"><h3>Calentamiento · ${mins(plan.warm)}</h3><div class="mute">${esc(plan.warmTxt)}</div>`;
  plan.blocks.forEach(b=>{
    const head = b.t==="sup" ? `${esc(b.name)} · ${b.rest}" de descanso` : `${esc(b.name)} · ${b.work>=120?mins(b.work):b.work+"\" / "+b.rest+"\""} × ${b.rounds}`;
    h += `<div class="blk ${b.t==="int"?"int":""}"><h3>${head}</h3></div><table>`;
    b.ex.forEach(e=>{ const pr=progress(e.id);
      h += `<tr><td><b>${esc(e.n)}</b><br><span class="mute">${b.t==="sup"?e.sets+" × "+repTxt(e)+" · ":""}${esc(e.cue)}</span><br><span class="tag ${pr.k}">${esc(pr.t.split(":")[0])}</span></td></tr>`; });
    h += `</table>`;
  });
  h += `</div><button class="pri big" id="go">▶ Empezar</button>`;
  $("#app").innerHTML = h;
  $("#back").onclick=()=>{ VIEW=null; render(); };
  document.querySelectorAll("[data-m]").forEach(c=>c.onchange=()=>{ const id=c.dataset.m;
    VIEW.mods = c.checked ? [...sel.filter(x=>x!==id), id] : sel.filter(x=>x!==id); renderPre(); });
  $("#go").onclick=()=>{ if(!plan.steps.length){ toast("Con estas reglas no queda ningún ejercicio"); return; } startSession(plan, t); };

/* ============ SESIÓN EN VIVO · TIEMPO CORRIDO ============
   Un único reloj: calentamiento → trabajo → descanso → … se encadenan solos.
   Solo dos botones: Pausa y Terminar. Cada serie se registra sola con lo de la última vez;
   durante el descanso puedes corregir las reps sin parar el reloj. */
const RING_C = ["var(--c-blue)","var(--c-orange)","var(--c-green)","var(--c-purple)","var(--c-sky)","var(--c-verm)","var(--c-yellow)","#8a8a8a"];
function autoSegs(L){
  if(L._segs) return L._segs;
  const segs=[]; let t=0;
  const push=(o)=>{ o.a=t; t+=o.d; o.b=t; segs.push(o); };
  if(L.plan.warm>0) push({k:"warm", d:L.plan.warm});
  L.plan.steps.forEach((s,i)=>{ push({k:"work", i, d:Math.max(10,Math.round(stepWork(s)))}); if(s.rest>0) push({k:"rest", i, d:s.rest}); });
  const exOrder=[]; L.plan.steps.forEach(s=>{ if(!exOrder.includes(s.e.id)) exOrder.push(s.e.id); });
  Object.defineProperty(L,"_segs",{value:segs, enumerable:false, writable:true});
  Object.defineProperty(L,"_tot",{value:t, enumerable:false, writable:true});
  Object.defineProperty(L,"_ex",{value:exOrder, enumerable:false, writable:true});
  return segs;
}
function autoEl(L){ return Math.max(0, ((L.paused||Date.now()) - L.start - (L.pauseAcc||0))/1000); }
function autoAt(L, el){ const S=autoSegs(L); let j=S.findIndex(x=>el<x.b); return j<0?S.length:j; }
function autoLog(L, i){
  const s=L.plan.steps[i], e=s.e; L.done=L.done||{}; if(L.done[i]) return; L.done[i]=1;
  const h=logsFor(e.id)[0], hs=h?h.sets[Math.min(s.r, h.sets.length-1)]:null;
  if(s.kind==="reps"){
    const rir=parseInt(String(L.plan.rir))||2;
    logPush(s, {reps: hs? hs.reps : e.hi, rir: hs&&hs.rir!=null? hs.rir : rir, var: hs? (hs.var||"") : "", workSec:Math.round(stepWork(s)), auto:true});
  } else logPush(s, {reps: hs? hs.reps : (e.iso? s.work : (e.iv?0:10)), var: hs?(hs.var||""):"", workSec:s.work, auto:true});
  L.last={id:e.id, n:L.logs[e.id].sets.length-1, i};
}
function autoCatchUp(L){ // registra todo lo que ya ha pasado (también si se cerró la app)
  const S=autoSegs(L), j=autoAt(L, autoEl(L));
  for(let k=0;k<j && k<S.length;k++) if(S[k].k==="work") autoLog(L, S[k].i);
  return j;
}
function ringSVG(L, el){
  const S=autoSegs(L), T=L._tot, R=88, cx=110, cy=110, sw=22, C=2*Math.PI*R, gap=1.2;
  const col=i=>RING_C[L._ex.indexOf(L.plan.steps[i].e.id)%RING_C.length];
  let arcs="", nums="";
  // un arco por paso (trabajo + su descanso), del color de su ejercicio
  const spans=[]; S.forEach(x=>{ if(x.k==="warm") spans.push({a:x.a,b:x.b,c:"#8a8a8a",i:-1}); else if(x.k==="work") spans.push({a:x.a,b:x.b,c:col(x.i),i:x.i}); else spans[spans.length-1].b=x.b; });
  spans.forEach(sp=>{
    const len=(sp.b-sp.a)/T*C, off=-sp.a/T*C, done=Math.min(Math.max(el-sp.a,0), sp.b-sp.a)/T*C;
    arcs+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${sp.c}" stroke-opacity=".28" stroke-width="${sw}" stroke-dasharray="${Math.max(0,len-gap)} ${C}" stroke-dashoffset="${off}"/>`;
    if(done>0) arcs+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${sp.c}" stroke-width="${sw}" stroke-dasharray="${Math.max(0,Math.min(done,len-gap))} ${C}" stroke-dashoffset="${off}"/>`;
  });
  // número de cada ejercicio en el centro de su primer arco
  L._ex.forEach((id,n)=>{ const i=L.plan.steps.findIndex(s=>s.e.id===id), sg=S.find(x=>x.k==="work"&&x.i===i); if(!sg) return;
    const ang=((sg.a+sg.b)/2/T)*2*Math.PI-Math.PI/2; nums+=`<text x="${cx+Math.cos(ang)*R}" y="${cy+Math.sin(ang)*R+4}" text-anchor="middle" class="rn">${n+1}</text>`; });
  const ang=(Math.min(el,T)/T)*2*Math.PI-Math.PI/2;
  const mk=`<line x1="${cx+Math.cos(ang)*(R-sw/2-4)}" y1="${cy+Math.sin(ang)*(R-sw/2-4)}" x2="${cx+Math.cos(ang)*(R+sw/2+4)}" y2="${cy+Math.sin(ang)*(R+sw/2+4)}" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>`;
  return `<g transform="rotate(-90 ${cx} ${cy})">${arcs}</g>${nums}${mk}`;
}
function renderAuto(){
  const L=DB.live; startTick(); keepAwake(true); document.body.classList.add("livemode");
  const S=autoSegs(L), el=autoEl(L), j=autoCatchUp(L); save();
  if(j>=S.length){ finishSession(); return; }
  L._j=j; const g=S[j], s=g.k==="warm"?null:L.plan.steps[g.i];
  const nextWork=S.slice(j+1).find(x=>x.k==="work"), ns=nextWork?L.plan.steps[nextWork.i]:null;
  const ph = L.paused?"PAUSA":g.k==="warm"?"CALENTAR":g.k==="work"?"TRABAJO":"DESCANSO";
  const showS = g.k==="rest" ? ns : s;   // en descanso, lo importante es lo que viene
  const serie = x=>x?(x.kind==="reps"?"Serie ":"Ronda ")+(x.r+1)+" de "+x.rounds:"";
  const lastSet = L.last && L.logs[L.last.id] ? L.logs[L.last.id].sets[L.last.n] : null, lastStep = L.last?L.plan.steps[L.last.i]:null;
  const exList = L._ex.map((id,n)=>{ const steps=L.plan.steps.map((x,k)=>({x,k})).filter(o=>o.x.e.id===id), dn=steps.filter(o=>L.done&&L.done[o.k]).length;
    const now = s && s.e.id===id && g.k==="work", st = dn===steps.length?"✓":now?"▶":dn?"◐":"·";
    return `<li class="${now?"now":""} ${dn===steps.length?"ok":""}"><span class="sw" style="background:${RING_C[n%RING_C.length]}">${n+1}</span><span class="nm">${esc(steps[0].x.e.n)}</span><span class="ct">${st} ${dn}/${steps.length}</span></li>`; }).join("");
  $("#app").innerHTML = `<div class="lvw">
    <div class="lv-top"><div><b id="lvPct">0%</b><span>hecho</span></div><div><b id="lvEl">0:00</b><span>llevas</span></div><div><b id="lvLeft">0:00</b><span>queda</span></div><div><b id="lvWork">0:00</b><span>trabajo</span></div></div>
    <div class="lv-ring"><svg viewBox="0 0 220 220" id="ring">${ringSVG(L,el)}</svg>
      <div class="lv-c"><span class="ph ${g.k}">${ph}</span><b id="clk">0:00</b><span>${g.k==="warm"?"Calentamiento":esc(serie(g.k==="rest"?ns:s))}</span></div></div>
    <div class="lv-ex">${g.k==="warm"?`<div class="nm">Calentamiento</div><div class="tg2">${esc(L.plan.warmTxt)}</div>`
      : showS?`<div class="pre">${g.k==="rest"?"Siguiente":"Ahora"}</div><div class="nm">${esc(showS.e.n)}</div>
        <div class="tg2">${showS.kind==="reps"?"<b>"+repTxt(showS.e)+"</b> · RIR "+esc(L.plan.rir):"<b>"+(showS.work>=120?mins(showS.work):showS.work+"\"")+"</b> "+esc(showS.e.cue)} · ${esc(serie(showS))}</div>`
      : `<div class="nm">Último descanso</div>`}
      ${g.k==="rest"&&lastSet&&lastStep?`<div class="lv-fix"><span>${esc(lastStep.e.n.split(" (")[0])}: </span><button id="lm" aria-label="Una rep menos">−</button><b>${lastSet.reps}</b><button id="lp" aria-label="Una rep más">+</button><span>${lastStep.kind==="reps"?"reps":lastStep.e.iso?"s":"reps"}</span></div>`:""}
    </div>
    <ul class="lv-list">${exList}</ul>
    <div class="lv-btn"><button id="snd" aria-pressed="${!!DB.settings.sound}" aria-label="Sonido">${DB.settings.sound?"🔊":"🔇"}</button><button class="pri" id="pause">${L.paused?"▶ Seguir":"⏸ Pausa"}</button><button id="finish">■ Terminar</button></div></div>`;
  // pantalla fija: ajusta la altura al hueco real bajo la cabecera y el rosco al espacio libre
  const lv=$(".lvw"), hd=document.querySelector("header"); window.scrollTo(0,0);
  const H=window.innerHeight-(hd?hd.offsetHeight:60)-10; lv.style.height=H+"px";
  const used=[".lv-top",".lv-ex",".lv-list",".lv-btn"].reduce((a,q)=>a+($(q)?$(q).offsetHeight:0),0)+30;
  lv.style.setProperty("--rs", Math.max(170, Math.min(H-used, 420))+"px");
  autoTick(true);
  $("#snd").onclick=()=>{ DB.settings.sound=!DB.settings.sound; save(); if(DB.settings.sound) beep(); renderAuto(); };
  $("#pause").onclick=()=>{ if(L.paused){ L.pauseAcc=(L.pauseAcc||0)+(Date.now()-L.paused); L.paused=null; } else L.paused=Date.now(); save(); renderAuto(); };
  $("#finish").onclick=()=>{ if(confirm("¿Terminar y guardar la sesión?")){ autoCatchUp(L); finishSession(); } };
  const fix=d=>{ if(!lastSet) return; lastSet.reps=Math.max(0,(+lastSet.reps||0)+d); lastSet.auto=false; save(); renderAuto(); };
  const lm=$("#lm"), lp=$("#lp"); if(lm) lm.onclick=()=>fix(-1); if(lp) lp.onclick=()=>fix(1);
}
function autoTick(force){
  const L=DB.live; if(!L||!L.auto) return;
  const S=autoSegs(L), el=autoEl(L), j=autoAt(L, el);
  if(j!==L._j && !force){
    beep(S[j]&&S[j].k==="work"?880:520,.3); buzz(S[j]&&S[j].k==="work"?[150,80,150]:200); lastBeepSec=-1;
    return renderAuto();
  }
  const g=S[j]; if(!g) return;
  const left=Math.ceil(g.b-el); const c=$("#clk"); if(c) c.textContent=fmt(left);
  if(!L.paused && left<=3 && left>0 && left!==lastBeepSec){ lastBeepSec=left; beep(660,.1); if(left===3) buzz(60); }
  const T=L._tot, work=S.filter(x=>x.k==="work").reduce((a,x)=>a+Math.min(Math.max(el-x.a,0),x.d),0);
  const set=(id,v)=>{ const x=$("#"+id); if(x) x.textContent=v; };
  set("lvPct", Math.floor(el/T*100)+"%"); set("lvEl", fmt(el)); set("lvLeft", fmt(T-el)); set("lvWork", fmt(work));
  const r=$("#ring"); if(r && Math.floor(el)!==L._lastSec){ L._lastSec=Math.floor(el); r.innerHTML=ringSVG(L,el); }
}

/* ============ SESIÓN EN VIVO (modo antiguo, por pasos) ============ */
function startSession(plan, t){
  DB.live = {v:3, id:uid(), name:t.name, tpl:JSON.parse(JSON.stringify(t)), date:isoDate(new Date()), start:Date.now(), plan, est:estimate(plan),
    ph:"warm", t0:Date.now(), dur:plan.warm, idx:0, logs:{}, pend:null, paused:null, auto:true, pauseAcc:0, done:{}};
  save(); keepAwake(true); beep(660); buzz(80); render();
}
let tickH=null, lastBeepSec=-1;
function startTick(){ if(!tickH) tickH=setInterval(tick, 250); }
function stopTick(){ if(tickH){ clearInterval(tickH); tickH=null; } }
function cur(){ const L=DB.live; return L.plan.steps[L.idx]; }
function tick(){
  const L = DB.live; if(!L) return stopTick();
  if(L.auto) return autoTick();
  const now = L.paused || Date.now(), el = (now-L.t0)/1000;
  const tot=$("#tot"); if(tot) tot.textContent = fmt((Date.now()-L.start)/1000);
  const c=$("#clk"), bar=$("#bar"), s=cur();
  const countdown = (dur, onEnd)=>{
    const left = Math.ceil(dur - el);
    if(c) c.textContent = fmt(left);
    if(bar) bar.style.width = Math.min(100, el/dur*100)+"%";
    if(left<=3 && left>0 && left!==lastBeepSec){ lastBeepSec=left; beep(660,.1); if(left===3) buzz(60); }
    if(left<=0){ lastBeepSec=-1; beep(990,.35); buzz([200,100,200]); onEnd(); }
  };
  if(L.ph==="warm" || L.ph==="rest") countdown(L.dur, endRest);
  else if(L.ph==="work" && s.kind==="time") countdown(s.work, endWork);
  else if(L.ph==="work"){ if(c) c.textContent = fmt(el); if(bar) bar.style.width = Math.min(100, el/stepWork(s)*100)+"%"; }
}
function prevVals(e){
  const mine = (DB.live.logs[e.id]||{sets:[]}).sets;
  if(mine.length) return mine[mine.length-1];
  const h = logsFor(e.id)[0]; if(h) return h.sets[Math.min(cur().r, h.sets.length-1)];
  return null;
}
function logPush(s, entry){
  const L=DB.live; L.logs[s.e.id] = L.logs[s.e.id] || {id:s.e.id, name:s.e.n, zone:s.e.z, mode:s.kind, lo:s.e.lo, hi:s.e.hi, presc:s.kind==="reps"?s.e.sets+"×"+repTxt(s.e):(s.e.iv?ivTxt(s.e.iv):s.work+"\"/"+(s.rest)+"\""), sets:[]};
  L.logs[s.e.id].sets.push(Object.assign({round:s.r+1}, entry));
}
function commitPend(){
  const L=DB.live, s=cur(); if(!L.pend) return;
  logPush(s, {reps:+L.pend.reps||0, var:L.pend.var||"", workSec:s.work}); L.pend=null;
}
function goStep(i){
  const L=DB.live; L.idx=i; L.paused=null;
  if(i>=L.plan.steps.length){ finishSession(); return; }
  const s=cur(), prev=L.plan.steps[i-1];
  if(s.kind==="time" && prev && prev.bi===s.bi){ L.ph="work"; beep(880,.2); buzz(120); }
  else L.ph="ready";
  L.t0=Date.now(); save(); renderLive();
}
function endRest(){
  const L=DB.live;
  if(L.ph==="warm"){ goStep(0); return; }
  if(cur().kind==="time") commitPend();
  goStep(L.idx+1);
}
function endWork(){
  const L=DB.live, s=cur();
  if(s.kind==="time"){
    const p = prevVals(s.e);
    L.pend = {reps: p ? p.reps : (s.e.iso? s.work : (s.e.iv?0:10)), var: p ? (p.var||"") : ""};
    if(s.rest>0){ L.ph="rest"; L.dur=s.rest; } else L.ph="log";
  } else { L.workSec = Math.round((Date.now()-L.t0)/1000); L.ph="log"; L.pend={rir:2}; }
  L.t0=Date.now(); save(); renderLive();
}
function dotsHtml(s){
  const L=DB.live, done=(L.logs[s.e.id]||{sets:[]}).sets;
  return Array.from({length:s.rounds},(_,k)=>{ const d=done[k];
    return `<span class="${d?"":"todo"} ${k===s.r && !d?"now":""}">${d?(d.reps+(s.kind==="reps"?"@"+d.rir:(s.e.iso?"s":""))):(s.kind==="reps"?"S":"R")+(k+1)}</span>`; }).join("");
}
function nextName(){ const L=DB.live, n=L.plan.steps[L.idx+1]; return n ? n.e.n+(n.r>0||n.kind==="time"?" · "+(n.kind==="reps"?"serie ":"ronda ")+(n.r+1):"") : "Fin de la sesión"; }
function renderLive(){
  const L = DB.live; startTick(); keepAwake(true);
  const s = cur();
  let h = `<div class="row" style="justify-content:space-between;margin-bottom:8px">
     <span class="chip">${esc(L.name)}${s&&L.ph!=="warm"?" · "+esc(s.bname):""}</span>
     <span class="mute">Total <b id="tot" class="num">0:00</b> / ~${mins(L.est)}</span></div>`;
  if(L.ph==="warm"){
    h += `<div class="card live"><span class="phase rest">CALENTAMIENTO</span>
      <div class="clock" id="clk">${fmt(L.dur)}</div><div class="bar"><i id="bar" style="width:0"></i></div>

  } else {

      <div class="target">${s.kind==="reps"?"<b>"+repTxt(e)+"</b> · RIR "+esc(L.plan.rir):(e.iv?"<b>"+(s.work>=120?mins(s.work):s.work+"\"")+"</b> · "+esc(e.cue):"<b>"+s.work+"\" a buen ritmo</b> · cuenta "+(e.iso?"segundos":"reps"))}</div>
      <div class="dots">${dotsHtml(s)}</div>`;
    if(L.ph==="ready"){

        <div class="hint">${esc(e.cue)}<br><b>${esc(lastHint(e))}</b></div>

    } else if(L.ph==="work"){

        <div class="clock" id="clk">${s.kind==="time"?fmt(s.work):"0:00"}</div><div class="bar"><i id="bar" style="width:0"></i></div>
        <div class="hint">${esc(e.cue)}</div>
        ${s.kind==="reps"?`<button class="pri big" id="endW">■ Serie hecha</button>`:`<button class="big" id="pause">${L.paused?"▶ Seguir":"⏸ Pausa"}</button>`}`;
    } else if(s.kind==="time" && L.pend){
      const lab = e.iv ? "Nivel / resistencia (opcional)" : e.iso ? "Segundos aguantados" : "Reps en este intervalo";
      h += `<span class="phase rest">${L.ph==="rest"?"DESCANSO":"REGISTRAR"}</span>
        ${L.ph==="rest"?`<div class="clock" id="clk">${fmt(L.dur)}</div><div class="bar"><i id="bar" style="width:0"></i></div>`:""}
        <label>${lab}</label>
        <div class="stepper"><button id="rm">−</button><input id="reps" type="number" inputmode="numeric" value="${esc(L.pend.reps)}"><button id="rp">+</button></div>

        <div class="stepper"><button id="rm">−</button><input id="reps" type="number" inputmode="numeric" value="${p.reps ?? e.hi}"><button id="rp">+</button></div>
        <label>RIR (repeticiones que te sobraban)</label>
        <div class="rir">${[0,1,2,3,4].map(r=>`<button data-rir="${r}" aria-pressed="${r===L.pend.rir}">${r}${r===4?"+":""}</button>`).join("")}</div>
        <label>Variante / banda / peso</label><input id="var" value="${esc(p.var||"")}" placeholder="ej. banda azul · 2×11 kg">
        <button class="pri big" id="saveR" style="margin-top:12px">✓ Guardar y descansar</button>`;
    } else {
      h += `<span class="phase rest">DESCANSO</span>

  h += `<div class="row"><button class="grow sm" id="skipStep">Saltar paso</button><button class="grow sm" id="finish">Terminar sesión</button></div>`;
  $("#app").innerHTML = h; tick();
  const on=(id,f)=>{ const b=$("#"+id); if(b) b.onclick=f; };
  on("skip", endRest);

  on("startW", ()=>{ L.ph="work"; L.t0=Date.now(); beep(880,.15); buzz(80); save(); renderLive(); });
  on("endW", endWork);
  on("pause", ()=>{ if(L.paused){ L.t0 += Date.now()-L.paused; L.paused=null; } else L.paused=Date.now(); save(); renderLive(); });
  on("rm", ()=>{ const i=$("#reps"); i.value=Math.max(0,(+i.value||0)-1); i.dispatchEvent(new Event("input")); });
  on("rp", ()=>{ const i=$("#reps"); i.value=(+i.value||0)+1; i.dispatchEvent(new Event("input")); });
  if(s && s.kind==="time" && L.pend){
    const r=$("#reps"), v=$("#var");
    if(r) r.oninput=()=>{ L.pend.reps=+r.value||0; save(); };
    if(v) v.oninput=()=>{ L.pend.var=v.value; save(); };
  }
  document.querySelectorAll("[data-rir]").forEach(b=>b.onclick=()=>{ L.pend.rir=+b.dataset.rir;
    document.querySelectorAll("[data-rir]").forEach(x=>x.setAttribute("aria-pressed", String(x===b))); });
  on("saveR", ()=>{
    logPush(s, {reps:+$("#reps").value, rir:L.pend.rir, var:$("#var").value.trim(), workSec:L.workSec});
    L.pend=null;
    if(s.rest>0){ L.ph="rest"; L.dur=s.rest; L.t0=Date.now(); lastBeepSec=-1; save(); renderLive(); }
    else goStep(L.idx+1);
  });
  on("saveT", ()=>{ commitPend(); goStep(L.idx+1); });
  on("skipStep", ()=>{ L.pend=null; goStep(L.ph==="warm"?0:L.idx+1); });
  on("finish", ()=>{ if(confirm("¿Terminar y guardar la sesión?")){ if(L.pend && cur() && cur().kind==="time") commitPend(); finishSession(); } });
}
function finishSession(){
  const L = DB.live; if(!L) return;
  const rec = {id:L.id, v:3, name:L.name, tpl:L.tpl, obj:L.plan.obj, fmt:L.plan.fmt, date:L.date, start:L.start, end:Date.now(),
    durSec:Math.round((Date.now()-L.start)/1000), estSec:L.est, week:L.plan.week, mods:L.plan.mods, rir:L.plan.rir,
    ex:Object.values(L.logs).filter(x=>x.sets.length), notes:"", rpe:null};
  DB.sessions.push(rec); DB.live=null; save(); keepAwake(false); stopTick(); document.body.classList.remove("livemode"); beep(880,.3); buzz([100,60,100]);
  VIEW={k:"sum", id:rec.id}; render();
}

/* ============ RESUMEN ============ */
function renderSummary(id){
  const s = DB.sessions.find(x=>x.id===id); if(!s){ VIEW=null; return render(); }
  const diff = s.durSec - s.estSec;
  let h = `<div class="card"><h2>${esc(sessionName(s))} · ${s.date}</h2>
    <div class="kpis"><div class="kpi"><b>${fmt(s.durSec)}</b><span class="mute">real</span></div>
      ${s.manual?`<div class="kpi"><b>A mano</b><span class="mute">registro manual</span></div>`:`<div class="kpi"><b>${fmt(s.estSec||0)}</b><span class="mute">calculado (${diff>=0?"+":""}${Math.round(diff/60)}')</span></div>`}</div>
    ${s.mods&&s.mods.length?`<div class="mute" style="margin-top:6px">Reglas aplicadas: ${s.mods.map(m=>MODS.find(x=>x.id===m)?.label).join(" · ")}</div>`:""}</div>
  <div class="card"><h3>Zonas trabajadas</h3>${(()=>{ const per=sessZones(s), d={}; FZ_SHOW.forEach(z=>{ const n=per[z]||0; const l=!n?0:n<4?1:n<7?2:n<10?3:4; d[z]={l, st:MODES.dia.key[l][1], txt:n?n+" series":"—"}; }); return bodySVG(d)+keyHTML("dia")+zoneListHTML(d); })()}</div>
  ${(!s.manual && s.ex.some(x=>x.sets.some(z=>z.auto)))?`<div class="card" style="border-left:4px solid var(--c-orange)"><h3>Confirma tus series</h3>
    <div class="mute small">Se apuntaron solas con lo de la última vez. Corrige lo que no cuadre y confirma: así la progresión usa datos reales.</div>
    ${s.ex.map((x,xi)=>`<div style="margin-top:8px"><b>${esc(x.name)}</b><div class="row" style="flex-wrap:wrap;gap:6px;margin-top:4px">${x.sets.map((z,zi)=>`<input type="number" inputmode="numeric" data-cf="${xi}:${zi}" value="${z.reps}" style="width:4.2em;text-align:center" aria-label="Serie ${zi+1}">`).join("")}<span class="mute small">${x.mode==="time"?(LIB_BY[x.id]||{}).iso?"seg":"reps":"reps"}</span></div></div>`).join("")}
    <button class="pri big" id="cfOk" style="margin-top:10px">✓ Confirmar series</button></div>`:""}
  ${s.manual?"":`<div class="card"><h3>Registro</h3><table><tr><th>Ejercicio</th><th>Por serie</th><th class="num">Total</th></tr>`}`;
  if(!s.manual) s.ex.forEach(x=>{ const pr = progress(x.id);
    const per = x.sets.map(z=>z.reps+(z.rir!=null?"@"+z.rir:"")).join(" · ");
    h += `<tr><td><b>${esc(x.name)}</b>${x.presc?` <span class="mute small">(${esc(x.presc)})</span>`:""}<br><span class="mute">${esc(x.sets.slice(-1)[0].var||"")}</span><br><span class="tag ${pr.k}">${esc(pr.t)}</span></td>
      <td>${per}</td><td class="num">${x.sets.reduce((a,z)=>a+(+z.reps||0),0)}</td></tr>`; });
  if(!s.manual) h += `</table></div>`;
  h += `
  <div class="card"><label>Esfuerzo de la sesión (1–10)</label>
    <div class="rir" style="grid-template-columns:repeat(5,1fr)">${[6,7,8,9,10].map(r=>`<button data-rpe="${r}" aria-pressed="${s.rpe===r}">${r}</button>`).join("")}</div>
    <label>Notas (molestias, sensaciones, cambios)</label><textarea id="notes" rows="3">${esc(s.notes)}</textarea>
    <button class="pri big" id="saveN" style="margin-top:10px">Guardar</button></div>
  <div class="row"><button class="grow" id="back">← Volver</button><button class="grow" id="del">Borrar sesión</button></div>`;
  $("#app").innerHTML = h; window.scrollTo(0,0);
  document.querySelectorAll("[data-rpe]").forEach(b=>b.onclick=()=>{ s.rpe=+b.dataset.rpe; save(); document.querySelectorAll("[data-rpe]").forEach(x=>x.setAttribute("aria-pressed", String(x===b))); });
  $("#saveN").onclick=()=>{ s.notes=$("#notes").value; save(); toast("Guardado"); };
  const cf=$("#cfOk"); if(cf) cf.onclick=()=>{ document.querySelectorAll("[data-cf]").forEach(i=>{ const [a,b]=i.dataset.cf.split(":").map(Number), z=s.ex[a].sets[b]; z.reps=Math.max(0,+i.value||0); delete z.auto; });
    s.ex.forEach(x=>x.sets.forEach(z=>delete z.auto)); save(); toast("Series confirmadas"); renderSummary(id); };
  $("#back").onclick=()=>{ VIEW=null; TAB="hist"; render(); };
  $("#del").onclick=()=>{ if(confirm("¿Borrar esta sesión del registro?")){ DB.sessions=DB.sessions.filter(x=>x.id!==id); save(); VIEW=null; render(); } };
}

/* ============ HISTORIAL ============ */
function renderHist(){
  if(!HIST.sel) HIST.sel=isoDate(new Date());
  const all=[...DB.sessions.map(x=>({k:"s", abbr:"FB", id:x.id, date:x.date, t:entryName(x), min:Math.round((x.durSec||0)/60), sub:x.manual?"a mano":x.ex.reduce((a,e)=>a+e.sets.length,0)+" series"})),
             ...DB.acts.map(a=>({k:"a", abbr:ACT_ABBR[a.type]||"OTR", id:a.id, date:a.date, t:a.type, min:+a.min||0, sub:[a.int, cardioDet(a), a.note].filter(Boolean).join(" · ")}))].sort((a,b)=>b.date.localeCompare(a.date));
  let h = summaryHTML() + calendarHTML() + dayCardHTML() + bodyCardHTML() + bodyCompHTML() + `<div class="card"><h2>Registro (${all.length})</h2>`;
  h += all.length ? `<ul class="list reg">${all.slice(0,40).map(x=>`<li><span class="tg ${x.abbr}">${x.abbr}</span><span class="grow"><b>${fmtD(x.date)}</b> · ${esc(x.t)} · ${x.min}'<br><span class="mute small">${esc(x.sub)}</span></span>${x.k==="s"?`<button class="sm" data-open="${x.id}">Ver</button>`:""}<button class="sm icon" data-del="${x.k}:${x.id}" aria-label="Borrar">✕</button></li>`).join("")}</ul>` : `<div class="mute">Aún no hay registros. Añade uno desde el día del calendario.</div>`;
  const ids = [...new Set(DB.sessions.flatMap(s=>s.ex.map(x=>x.id)))].filter(id=>LIB_BY[id]);
  h += `</div>`;
  if(ids.length){ h += `<div class="card"><h2>Progresión por ejercicio</h2><table><tr><th>Ejercicio</th><th>Últimas</th><th>Decisión</th></tr>`;
    ids.forEach(id=>{ const L=logsFor(id).slice(0,3), pr=progress(id);
      h+=`<tr><td>${esc(LIB_BY[id].n)}</td><td class="mute">${L.map(l=>l.sets.map(s=>s.reps).join("·")).join("<br>")}</td><td><span class="tag ${pr.k}">${esc(pr.t.split(":")[0])}</span></td></tr>`; });
    h += `</table></div>`; }
  $("#app").innerHTML = h; bindHistTop();
}

/* ============ INFORME SEMANAL (para que Claude lo valore) ============ */
function weeklyReport(){
  const from = isoDate(new Date(Date.now()-6*864e5)), to = isoDate(new Date());
  const ss = DB.sessions.filter(s=>s.date>=from).sort((a,b)=>a.start-b.start);
  const vol = {}; ss.forEach(s=>s.ex.forEach(x=>{ const z=(LIB_BY[x.id]||{}).z||x.zone; if(z) vol[ZONES[z]||z]=(vol[ZONES[z]||z]||0)+x.sets.length; }));
  return {
    recuperacion_hoy: (f=>Object.fromEntries(FZ_SHOW.map(z=>[FZ_SHORT[z], readyTxt(readyIn(z,f[z]||0))])))(fatigueMap()),
    tipo:"informe_semanal_fullbody_jjb", generado:new Date().toISOString(), periodo:{desde:from, hasta:to},
    semana_del_ciclo:weekInfo().week, ciclo:weekInfo().cycle, inicio_ciclo:DB.start,
    sesiones: ss.map(s=>({fecha:s.date, nombre:sessionName(s), objetivo:OBJ[s.obj]||s.obj, formato:FMT[s.fmt]||s.fmt,
      duracion_min:Math.round(s.durSec/60), calculado_min:Math.round((s.estSec||0)/60), esfuerzo_1a10:s.rpe, reglas_del_dia:s.mods, notas:s.notes,
      ejercicios:s.ex.map(x=>({nombre:x.name, zona:ZONES[(LIB_BY[x.id]||{}).z]||x.zone, prescrito:x.presc, modo:x.mode==="time"?"intervalos":"series",
        series:x.sets.map(z=>({reps:z.reps, rir:z.rir, variante:z.var})), decision_app:progress(x.id).t}))})),
    series_por_zona: vol,
    deporte_y_cardio: DB.acts.filter(a=>a.date>=from).map(a=>({fecha:a.date, tipo:a.type, minutos:a.min, intensidad:a.int, modo:a.modo, fc_media:a.hr, fc_max:a.hrMax, km:a.km, ritmo:(a.km&&a.type!=="Elíptica")?paceTxt(+a.min,+a.km):undefined, nota:a.note})),
    composicion_corporal: { mediciones_28d: DB.weights.filter(w=>w.date>=isoDate(new Date(Date.now()-27*864e5))),
      tendencia_4_semanas: Object.fromEntries(BC.map(m=>{ const st=bcStatus(m); return [m.n, st?st.verdict:"sin datos"]; })) },
    plantillas_guardadas: DB.tpls.map(t=>({nombre:t.name, objetivo:OBJ[t.obj], formato:FMT[t.fmt], ejercicios:tplItems(t).map(e=>e.n+" "+(e.iv?ivTxt(e.iv):e.sets+"×"+repTxt(e)))}))
  };
}

/* ============ DATOS ============ */
function renderData(){
  const h = `<div class="okbox"><b>Versión de la app:</b> ${APP_V}</div><div class="card"><h2>Informe semanal para Claude</h2>
    <div class="mute">Últimos 7 días: sesiones, series, reps, RIR, esfuerzo, notas, deporte y peso. Cópialo y pégalo en el chat.</div>
    <button class="pri big" id="copyR" style="margin-top:10px">📋 Copiar informe</button>
    <button class="big" id="dlR" style="margin-top:8px">⬇ Descargar informe (JSON)</button></div>
  <div class="card"><h2>Ciclo</h2>
    <label>Fecha de inicio (lunes de la semana 1)</label><input id="start" type="date" value="${DB.start}">
    <button id="saveStart" style="margin-top:8px">Guardar fecha</button>
    <table style="margin-top:10px">${[1,2,3,4].map(w=>`<tr><td><b>Sem ${w}</b></td><td>${WEEK[w].txt}</td></tr>`).join("")}</table></div>
  <div class="card"><h2>Avisos</h2>
    <label class="check"><input type="checkbox" id="sound" ${DB.settings.sound?"checked":""}><span><b>Sonido</b> en los cambios</span></label>
    <label class="check"><input type="checkbox" id="vib" ${DB.settings.vib?"checked":""}><span><b>Vibración</b> en los cambios<br><span class="mute">Android sí; iPhone no la permite en web</span></span></label></div>
  <div class="card"><h2>Copia de seguridad completa</h2>
    <div class="mute">Todo: sesiones, plantillas, actividades y peso. Exporta cada semana.</div>
    <button class="pri big" id="expJ" style="margin-top:10px">Exportar copia (JSON)</button>
    <div class="row" style="margin-top:8px"><button class="grow" id="expC">Series (CSV)</button><button class="grow" id="expA">Actividades (CSV)</button></div>
    <label style="margin-top:12px">Importar copia (JSON) · se suma a lo que hay, sin duplicar</label><input id="imp" type="file" accept="application/json,.json"></div>
  <div class="card"><h2>Empezar de cero</h2>
    <div class="mute">Borra sesiones, deporte y peso, y reinicia el ciclo en la semana 1 desde este lunes. Las sesiones guardadas del planificador se conservan. Antes descarga una copia automáticamente.</div>
    <button class="big" id="reset" style="margin-top:10px">Borrar registros y empezar de cero</button></div>`;
  $("#app").innerHTML = h;
  $("#copyR").onclick=async()=>{ const txt=JSON.stringify(weeklyReport(), null, 1);
    try{ await navigator.clipboard.writeText(txt); toast("Informe copiado: pégalo en el chat"); }
    catch(e){ const ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); toast("Informe copiado"); }catch(_){ toast("No se pudo copiar: usa Descargar"); } ta.remove(); } };
  $("#dlR").onclick=()=>download("informe_semana_"+isoDate(new Date())+".json", JSON.stringify(weeklyReport(), null, 1), "application/json");
  $("#saveStart").onclick=()=>{ if($("#start").value){ DB.start=$("#start").value; save(); toast("Fecha guardada"); render(); } };
  $("#sound").onchange=e=>{ DB.settings.sound=e.target.checked; save(); if(e.target.checked) beep(); };
  $("#vib").onchange=e=>{ DB.settings.vib=e.target.checked; save(); buzz(80); };
  $("#expJ").onclick=()=>download("fullbody_jjb_"+isoDate(new Date())+".json", JSON.stringify(Object.assign({}, DB, {live:null}), null, 1), "application/json");
  $("#expC").onclick=()=>{ const rows=[["fecha","sesion","semana","ejercicio","zona","modo","prescrito","serie","reps","rir","variante","duracion_sesion_s"]];
    DB.sessions.forEach(s=>s.ex.forEach(x=>x.sets.forEach((z,i)=>rows.push([s.date,sessionName(s),s.week,x.name,ZONES[(LIB_BY[x.id]||{}).z]||"",x.mode||"reps",x.presc||"",z.round||i+1,z.reps,z.rir??"",z.var,s.durSec]))));
    download("series_"+isoDate(new Date())+".csv", toCSV(rows), "text/csv"); };
  $("#expA").onclick=()=>{ const rows=[["fecha","tipo","minutos","intensidad","modo","fc_media","fc_max","km","nota"]]; DB.acts.forEach(a=>rows.push([a.date,a.type,a.min,a.int,a.modo||"",a.hr||"",a.hrMax||"",a.km||"",a.note]));
    rows.push([]); rows.push(["fecha","peso_kg","masa_muscular_kg","masa_grasa_kg","agua_kg","grasa_%","imc","metabolismo_basal_kcal","en_ayunas"]);
    DB.weights.forEach(w=>rows.push([w.date,w.kg??"",w.mus??"",w.fatKg??"",w.wat??"",w.fat??"",w.imc??"",w.bmr??"",w.std===false?"no":"sí"]));
    download("actividades_"+isoDate(new Date())+".csv", toCSV(rows), "text/csv"); };
  $("#reset").onclick=()=>{ if(!confirm("Se descargará una copia y se borrarán todos los registros. ¿Seguir?")) return;
    download("fullbody_jjb_antes_de_borrar_"+isoDate(new Date())+".json", JSON.stringify(Object.assign({}, DB, {live:null}), null, 1), "application/json");
    if(!confirm("Último aviso: ¿borrar los registros ahora?")) return;
    DB.sessions=[]; DB.acts=[]; DB.weights=[]; DB.live=null; DB.draft=null; DB.start=mondayOf(new Date()); HIST={ym:null, sel:null, mode:"dia"};
    save(); toast("Registros borrados · semana 1"); TAB="hoy"; render(); };
  $("#imp").onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{ try{ const d=cleanData(JSON.parse(r.result)); if(!d.sessions.length && !d.acts.length && !d.weights.length) throw 0;
      const merge=(a,b,k)=>{ const ids=new Set(a.map(x=>x[k])); b.forEach(x=>{ if(!ids.has(x[k])) a.push(x); }); };
      merge(DB.sessions,d.sessions,"id"); merge(DB.acts,d.acts||[],"id"); merge(DB.weights,d.weights||[],"date"); merge(DB.tpls,d.tpls||[],"id");
      if(d.start) DB.start=d.start; save(); toast("Copia importada"); render(); }catch(err){ toast("Archivo no válido"); } };
    r.readAsText(f); };
}
function toCSV(rows){ return "﻿"+rows.map(r=>r.map(v=>{ v=String(v??""); return /[;",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(";")).join("\n"); }
function download(name, text, type){
  const blob=new Blob([text],{type}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

render();
if(LOAD_WARN) setTimeout(()=>toast(LOAD_WARN), 600);
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
</script>
</body>
